<title>Slot Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#1d2824; --muted:#63706a; --paper:#f5f0e3; --surface:#fffdf7; --surface-2:#ede6d5;
  --forest:#143b30; --forest-2:#205844; --gold:#c69735; --gold-soft:#f2dfaa;
  --red:#993f37; --blue:#315f70; --line:#d8cfba;
  --shadow:0 10px 26px rgba(31,42,36,.12); --radius:18px;
  --r-base:#8a938b; --r-tuned:#2f6b52; --r-enhance:#6f8a30; --r-max:#c69735; --r-fun:#315f70;
  --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:60;padding:10px 14px 0;color:#fff8e8;
  background:linear-gradient(135deg,#102b23,#1b4b3c 72%,#765b24);box-shadow:0 5px 18px rgba(17,43,35,.28)}
.hdr-in{width:min(1400px,100%);margin:0 auto}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0 0 2px;color:#e6cc91;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.brand h1{margin:0;font-family:var(--serif);font-size:clamp(21px,4vw,29px);line-height:1;font-weight:400}
.hdr-acts{display:flex;gap:7px;flex-wrap:wrap}
.ghost{min-height:32px;padding:5px 11px;border:1px solid rgba(255,255,255,.32);border-radius:999px;
  color:#d9e8df;background:rgba(8,31,24,.4);font-size:11px;font-weight:700;white-space:nowrap}
.ghost:hover{color:var(--forest);background:#fff4d7}
.tabs{display:flex;gap:7px;margin:11px 0 0;padding-bottom:11px}
.tab{flex:1;max-width:220px;min-height:40px;display:flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid rgba(255,255,255,.22);border-radius:12px 12px 0 0;color:#d7e6df;background:rgba(255,255,255,.07);
  font-size:13px;font-weight:700}
.tab[aria-selected="true"]{color:var(--forest);background:var(--paper);border-color:var(--paper)}
.tab-n{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.14);font-size:10px}
.tab[aria-selected="true"] .tab-n{color:#fff;background:var(--forest-2)}

main{width:min(1400px,100%);margin:0 auto;padding:16px 14px 60px}
.view[hidden]{display:none}
.note{margin:0;color:var(--muted);font-size:12px}

/* deck rail + stat card */
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.rail-btn{flex:0 0 auto;min-width:158px;text-align:left;padding:8px 11px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.rail-btn[aria-pressed="true"]{border-color:var(--forest-2);box-shadow:0 0 0 2px rgba(32,88,68,.18),var(--shadow)}
.rail-no{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rail-nm{font-family:var(--serif);font-size:15px;line-height:1.2}
.rail-st{margin-top:3px;font-size:11px;color:var(--muted)}
.deck-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  box-shadow:var(--shadow);padding:14px 15px;margin-bottom:14px}
.deck-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.deck-card h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:400}
.deck-sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.stat{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12px}
.stat.ok{border-color:#b9cfc2;background:#e9f2ec}
.stat.warn{border-color:#e0c3a6;background:#fbf0e4}
.collapse{display:flex;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.cstep{flex:1;padding:6px 9px;font-size:11px;color:var(--muted);border-right:1px solid var(--line)}
.cstep:last-child{border-right:0}
.cstep b{display:block;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.cstep.done{background:var(--surface)} .cstep.done b{color:var(--ink)}
.cstep.now{background:var(--gold-soft)} .cstep.now b{color:var(--forest)}

/* groups */
.grp{margin-bottom:11px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.grp-h{width:100%;display:flex;align-items:center;gap:10px;padding:10px 13px;border:0;background:var(--surface-2);text-align:left}
.grp-h .car{transition:transform .16s ease;color:var(--muted);font-size:11px}
.grp[data-open="1"] .grp-h .car{transform:rotate(90deg)}
.grp-nm{font-weight:700;font-size:13px}
.grp-ct{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.grp-body{display:none} .grp[data-open="1"] .grp-body{display:block}

/* slot row */
.slot{border-top:1px solid var(--line)}
.slot-h{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:9px 13px}
.slot:hover .slot-h{background:#fffef9}
.slot[data-open="1"] .slot-h{background:var(--gold-soft)}
.box{width:19px;height:19px;margin:0;accent-color:var(--forest-2);cursor:pointer}
.box:disabled{cursor:not-allowed;opacity:.4}
.slot-main{min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:0}
.slot-l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.slot-nm{font-weight:600;font-size:14px}
.slot-nm.hole{color:var(--red);font-style:italic}
.qty{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.rung{padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.rung.base{background:var(--r-base)} .rung.tuned{background:var(--r-tuned)}
.rung.enhance{background:var(--r-enhance)} .rung.max{background:var(--r-max);color:#3c2c05}
.rung.fun{background:var(--r-fun)} .rung.basic,.rung.none{background:var(--surface-2);color:var(--muted)}
.slot-l2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-r{display:flex;align-items:center;gap:11px}
.price{font-size:13px;font-variant-numeric:tabular-nums}
.price.buy{color:var(--gold);font-weight:700}
.loc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap}
.loc .g{font-size:11px}
.loc.deck{color:var(--forest-2)} .loc.other{color:var(--red);font-weight:600}
.loc.bench{color:var(--muted)} .loc.buy{color:var(--muted)} .loc.ordered{color:var(--blue);font-weight:600}
.of{min-width:52px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);
  font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.slot[data-open="1"] .of{border-color:var(--forest-2);color:var(--forest-2);background:var(--surface)}
.more{width:100%;padding:9px 13px;border:0;border-top:1px solid var(--line);background:var(--paper);
  text-align:left;font-size:12px;color:var(--forest-2);font-weight:600}
.more:hover{background:var(--gold-soft)}

/* candidate rail */
.cand{display:none;padding:0 13px 13px 49px;background:#fffef9;border-top:1px dashed var(--line)}
.slot[data-open="1"] .cand{display:block}
.cand-lab{margin:11px 0 7px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cand-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tile{flex:0 0 auto;width:162px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--forest-2)}
.tile[aria-pressed="true"]{border-color:var(--forest-2);background:var(--gold-soft);box-shadow:0 0 0 2px rgba(32,88,68,.16)}
.tile-nm{font-size:12.5px;font-weight:600;line-height:1.25}
.tile-ft{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px}
.fit{color:var(--muted);font-variant-numeric:tabular-nums}
.why{margin:11px 0 0;border-left:3px solid var(--gold);background:var(--paper);border-radius:0 8px 8px 0;overflow:hidden}
.why-part{padding:8px 11px;font-size:12.5px}
.why-part+.why-part{border-top:1px solid var(--line)}
.why-k{display:block;margin-bottom:2px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cand-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:11.5px;font-weight:600}
.mini:hover{border-color:var(--forest-2)}
.mini.prime{border-color:var(--forest-2);color:#fff;background:var(--forest-2)}

/* ---------- shop filter bar ---------- */
.fbar{position:relative;z-index:20;padding:10px 12px;margin-bottom:11px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.frow+.frow{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.fdrop{position:relative}
.fbtn{min-height:33px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper);
  font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.fbtn[data-on="1"]{border-color:var(--forest-2);background:var(--gold-soft)}
.fbtn .cnt{display:grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--forest-2);color:#fff;font-size:10px;font-variant-numeric:tabular-nums}
.pop{position:absolute;top:calc(100% + 5px);left:0;z-index:40;min-width:186px;max-height:290px;overflow-y:auto;
  padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.pop[hidden]{display:none}
.pop label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;font-size:12.5px;cursor:pointer}
.pop label:hover{background:var(--paper)}
.pop input{width:15px;height:15px;accent-color:var(--forest-2);margin:0}
.pop-foot{display:flex;gap:6px;margin-top:5px;padding-top:6px;border-top:1px solid var(--line)}
.pop-foot button{flex:1;padding:4px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:11px;font-weight:600}
.fq{flex:1;min-width:140px;min-height:33px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12.5px}
.fsel{min-height:33px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12.5px}
.flab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{padding:5px 12px;border:0;background:none;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--forest-2);color:#fff}
.f-tot{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.f-tot b{color:var(--ink);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip-f{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border:1px solid var(--forest-2);
  border-radius:999px;background:var(--gold-soft);font-size:11.5px;font-weight:600}
.chip-f button{width:17px;height:17px;border:0;border-radius:50%;background:rgba(32,88,68,.16);font-size:11px;line-height:1;color:var(--forest)}

/* ---------- shop table ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
.tbl th{position:sticky;top:0;z-index:10;padding:8px 10px;background:var(--surface-2);text-align:left;
  font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;gap:5px;align-items:center}
.tbl th .ar{color:var(--forest-2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover td{background:#fffef9;cursor:pointer}
.tbl tr.band td{background:var(--paper);border-bottom:1px solid var(--line);border-top:2px solid var(--line)}
.tbl tr.band:hover td{background:var(--paper);cursor:default}
.band-nm{font-weight:800;font-size:12px;letter-spacing:.04em}
.band-ct{float:right;font-size:11.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.cell-nm{font-weight:600}
.pill{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);font-size:11px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.18)}
.chipd{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:var(--paper);
  font-size:10px;font-weight:700;color:var(--muted);margin-right:3px}

/* tri-state */
.tri{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.tri button{padding:4px 9px;border:0;background:none;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.tri button+button{border-left:1px solid var(--line)}
.tri button[aria-pressed="true"][data-s="need"]{background:var(--surface-2);color:var(--ink)}
.tri button[aria-pressed="true"][data-s="ordered"]{background:var(--blue);color:#fff}
.tri button[aria-pressed="true"][data-s="hand"]{background:var(--forest-2);color:#fff}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;padding:11px}
.gcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.gart{aspect-ratio:63/44;display:grid;place-items:center;background:linear-gradient(140deg,#e7e0cd,#d3ccb6);
  position:relative}
.gart span{font-family:var(--serif);font-size:12px;color:#7d7663;padding:6px;text-align:center}
.gbody{padding:9px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.gnm{font-size:12.5px;font-weight:600;line-height:1.25}
.gmeta{font-size:11px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:5px}

/* bench + drawer */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(20,32,27,.42);border:0;padding:0}
.scrim[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(440px,100%);overflow-y:auto;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(20,32,27,.2)}
.drawer[hidden]{display:none}
.dr-h{position:sticky;top:0;z-index:5;padding:14px 16px;color:#fff8e8;background:linear-gradient(135deg,#102b23,#1b4b3c)}
.dr-h h3{margin:2px 0 0;font-family:var(--serif);font-size:20px;font-weight:400}
.dr-x{position:absolute;top:11px;right:12px;width:29px;height:29px;border:1px solid rgba(255,255,255,.3);
  border-radius:50%;background:rgba(8,31,24,.4);color:#fff8e8;font-size:15px;line-height:1}
.dr-sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-sec:last-child{border-bottom:0}
.dr-job{display:block;margin-bottom:7px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.dr-sec h4{margin:0 0 6px;font-family:var(--serif);font-size:16px;font-weight:400}
.dr-sec p{margin:0 0 8px;font-size:13px} .dr-sec p:last-child{margin-bottom:0}
.dr-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin:0}
.dr-grid dt{color:var(--muted)} .dr-grid dd{margin:0;font-weight:600}
.bench-item{padding:11px 16px;border-bottom:1px solid var(--line)}
.bench-nm{font-weight:600;font-size:13.5px}
.bench-fits{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.toast{position:fixed;left:50%;bottom:22px;z-index:120;transform:translateX(-50%) translateY(14px);
  max-width:min(460px,92vw);padding:10px 16px;border-radius:999px;color:#fff8e8;background:var(--forest);
  box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .slot-h{grid-template-columns:22px 1fr;row-gap:6px}
  .slot-r{grid-column:2;justify-content:flex-start}
  .cand{padding-left:13px}
  .tab{font-size:12px}
  .f-tot{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand">
      <div>
        <p class="eyebrow">Commander field guide &middot; shell</p>
        <h1>Trey's Deck Matrix</h1>
      </div>
      <div class="hdr-acts">
        <button class="ghost" data-act="bench">&#9671; Bench <span id="benchn">0</span></button>
        <button class="ghost" data-act="merge">&#8681; Merge purchases</button>
        <button class="ghost" data-act="loadactive">&#8635; Load Active</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-tab="deck" aria-selected="true"><span class="tab-n">1</span><span>Deck</span></button>
      <button class="tab" data-tab="shop" aria-selected="false"><span class="tab-n">2</span><span>Shop</span></button>
    </nav>
  </div>
</header>

<main>
  <section class="view" id="v-deck">
    <div class="rail" id="rail"></div>
    <div class="deck-card" id="deckcard"></div>
    <div id="groups"></div>
  </section>

  <section class="view" id="v-shop" hidden>
    <div class="fbar" id="fbar"></div>
    <div id="shopout"></div>
  </section>
</main>

<button class="scrim" id="scrim" hidden aria-label="Close panel"></button>
<aside class="drawer" id="drawer" hidden aria-label="Panel"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function money(n){return "$"+n.toFixed(2)}
function plur(n,w){return n+" "+w+(n===1?"":"s")}

/* ============ vocabulary ============ */
var RUNGS=["base","tuned","enhance","fun","max"];
var RUNGLAB={base:"Base",tuned:"Tuned",enhance:"Enhance",fun:"Fun",max:"Max",basic:"Basic",none:"Empty"};
var COLORLAB={W:"White",U:"Blue",B:"Black",R:"Red",G:"Green",M:"Multicolor",C:"Colorless"};
var COLORHEX={W:"#f4efdc",U:"#a9c9e0",B:"#9a94a3",R:"#dda291",G:"#a6c3a4",M:"#e3ce8f",C:"#cfc8bb"};
var RARLAB={C:"Common",U:"Uncommon",R:"Rare",M:"Mythic"};
var BANDS=["<$1","$1","$2","$3","$4","$5","$6","$7-15","$15+"];
function bandOf(p){
  if(p<1)return "<$1"; if(p<2)return "$1"; if(p<3)return "$2"; if(p<4)return "$3";
  if(p<5)return "$4";  if(p<6)return "$5"; if(p<7)return "$6"; if(p<15)return "$7-15"; return "$15+";
}
function locBits(l){
  if(l==="deck")   return {g:"\u25CF",t:"In deck", c:"deck"};
  if(l==="bench")  return {g:"\u25C7",t:"Bench",   c:"bench"};
  if(l==="buy")    return {g:"\u25CB",t:"To buy",  c:"buy"};
  if(l==="ordered")return {g:"\u29D6",t:"Ordered", c:"ordered"};

/* ============ deck totals ============ */
function totals(d){
  var D=DECKS[d], sleeved=D.hiddenSleeved, buyN=D.hiddenBuy, buyV=D.hiddenBuyVal, tot=0, holes=0;
  D.groups.forEach(function(g){ tot+=g.total });
  allSlots(d).forEach(function(s){
    var p=pickOf(s);
    if(s.inBox) sleeved+=s.qty;
    if(s.pick==="none") holes+=s.qty;
    else if(p.loc==="buy"){ buyN+=s.qty; buyV+=p.price*s.qty }
  });
  return {tot:tot,sleeved:sleeved,buyN:buyN,buyV:buyV,holes:holes};
}
function benchCards(){
  var out=[];
  Object.keys(DECKS).forEach(function(k){
    allSlots(k).forEach(function(s){
      rungsOf(s).concat(["basic"]).forEach(function(r){
        var cd=s.cands[r]; if(cd&&cd.loc==="bench") out.push({card:cd,slot:s,deck:k,rung:r});
      });
      s.owned.forEach(function(o){ if(o.loc==="bench") out.push({card:o,slot:s,deck:k,rung:"own"}) });
    });
  });
  var seen={}, uniq=[];
  out.forEach(function(x){ if(!seen[x.card.name]){seen[x.card.name]=1; uniq.push(x)} });
  return uniq;
}

  if(filler[key]) return filler[key];
  var have=g.slots.reduce(function(a,s){return a+s.qty},0), need=g.total-have, out=[];
  for(var i=0;i<need;i++){
    var id=key.replace(/\W/g,"")+"x"+i;

/* ============ shop ============ */
var ACQ={};
var SF={status:[],color:[],type:[],band:[],rarity:[],where:[],deck:[],q:"",
        view:"table",groupBy:"where",sortKey:"name",sortDir:"asc"};
var COLS=[
 {k:"status",l:"Status",sort:false},{k:"name",l:"Card"},{k:"decks",l:"Decks"},
 {k:"color",l:"Color"},{k:"type",l:"Type"},{k:"rarity",l:"Rarity"},
 {k:"band",l:"Price band"},{k:"price",l:"Target"},{k:"where",l:"Where"}
];
var GROUPBY=[["none","No grouping"],["where","Where to buy"],["band","Price band"],["color","Color"],
             ["type","Type"],["rarity","Rarity"],["deck","Deck"],["status","Status"]];

function shopRows(){
  var map={};
  Object.keys(DECKS).forEach(function(k){
    allSlots(k).forEach(function(s){
      if(s.pick==="none") return;
      var p=pickOf(s);
      var r=map[p.name]||(map[p.name]={name:p.name,price:p.price,loc:p.loc,where:s.where,
        color:COLORLAB[p.color],ckey:p.color,type:s.type==="Commander"?"Creature":s.type,
        rarity:RARLAB[p.rar],decks:{},qty:0});
      r.decks["D"+DECKS[k].no]=1; r.qty+=s.qty;
    });
  });
  return Object.keys(map).map(function(n){
    var r=map[n];
    if(!ACQ[n]) ACQ[n]={ordered:r.loc==="ordered"?r.qty:0, hand:(r.loc!=="buy"&&r.loc!=="ordered")?r.qty:0};
    var a=ACQ[n];
    r.ordered=Math.min(a.ordered,r.qty); r.hand=Math.min(a.hand,r.qty);
    r.need=Math.max(0,r.qty-r.ordered-r.hand);
    r.status = r.hand>=r.qty?"In hand" : (r.need===0?"Ordered" : (r.hand||r.ordered?"Partly here":"Not in hand"));
    r.band=bandOf(r.price); r.deckList=Object.keys(r.decks);
    return r;
  });
}
function passes(r){
  if(SF.status.length && SF.status.indexOf(r.status)<0) return false;
  if(SF.color.length  && SF.color.indexOf(r.color)<0)   return false;
  if(SF.type.length   && SF.type.indexOf(r.type)<0)     return false;
  if(SF.band.length   && SF.band.indexOf(r.band)<0)     return false;
  if(SF.rarity.length && SF.rarity.indexOf(r.rarity)<0) return false;
  if(SF.where.length  && SF.where.indexOf(r.where)<0)   return false;
  if(SF.deck.length   && !SF.deck.some(function(d){return r.decks[d]})) return false;
  if(SF.q && r.name.toLowerCase().indexOf(SF.q.toLowerCase())<0) return false;
  return true;
}
function valOf(r,k){
  if(k==="decks") return r.deckList.join(",");
  if(k==="price") return r.price;
  if(k==="band")  return BANDS.indexOf(r.band);
  return r[k]!==undefined?r[k]:"";
}
function sortRows(rows){
  var k=SF.sortKey,dir=SF.sortDir==="asc"?1:-1;
  return rows.slice().sort(function(a,b){
    var x=valOf(a,k),y=valOf(b,k);
    if(typeof x==="number"&&typeof y==="number") return (x-y)*dir;
    return String(x).localeCompare(String(y))*dir;
  });
}
function groupRows(rows){
  if(SF.groupBy==="none") return [["",rows]];
  var by={},order=[];
  rows.forEach(function(r){
    var g = SF.groupBy==="deck" ? r.deckList.join(" + ") : r[SF.groupBy];
    if(!by[g]){by[g]=[];order.push(g)}
    by[g].push(r);
  });
  if(SF.groupBy==="band") order.sort(function(a,b){return BANDS.indexOf(a)-BANDS.indexOf(b)});
  else order.sort();
  return order.map(function(g){return [g,by[g]]});
}
function distinct(k){
  if(k==="band") return BANDS.slice();   /* the drawers exist whether or not you need one today */
  var s={},all=shopRows();
  if(k==="deck"){ all.forEach(function(r){r.deckList.forEach(function(d){s[d]=1})}) }
  else all.forEach(function(r){ s[r[k]]=1 });
  var out=Object.keys(s);
  if(k==="band") out.sort(function(a,b){return BANDS.indexOf(a)-BANDS.indexOf(b)});
  else out.sort();
  return out;
}

function find(id){var o=null;Object.keys(DECKS).forEach(function(k){
  allSlots(k).concat(Object.keys(filler).reduce(function(a,f){return a.concat(filler[f])},[]))
    .forEach(function(s){if(s.id===id)o=s})});return o}
function punch(donor,name,borrower){var hit=null;
  allSlots(donor).forEach(function(s){var p=pickOf(s);
    if(p.name===name&&p.loc==="deck"){p.loc=borrower;s.inBox=false;hit=s.id.toUpperCase()}});return hit}
function setAcq(name,which){
  var rows=shopRows(),r=null; rows.forEach(function(x){if(x.name===name)r=x});
  if(!r) return;
  var a=ACQ[name];
  if(which==="need"){ if(a.hand>0)a.hand--; else if(a.ordered>0)a.ordered--; }
  if(which==="ordered"){ if(a.ordered+a.hand<r.qty)a.ordered++; }
  if(which==="hand"){ if(a.hand<r.qty){a.hand++; if(a.ordered>0)a.ordered--;} }
  /* flow back to the deck: a card fully in hand becomes owned and unassigned */
  Object.keys(DECKS).forEach(function(k){ allSlots(k).forEach(function(s){
    if(s.pick==="none")return; var p=pickOf(s); if(p.name!==name)return;
    if(a.hand>=r.qty && (p.loc==="buy"||p.loc==="ordered")){ p.loc="bench" }
    else if(a.ordered>0 && a.hand===0 && p.loc==="buy"){ p.loc="ordered" }
    else if(a.hand===0 && a.ordered===0 && (p.loc==="bench"||p.loc==="ordered")){ p.loc="buy"; s.inBox=false }
  })});
}
document.addEventListener("click",function(e){
  var el;
  if(!e.target.closest(".fdrop")) document.querySelectorAll(".pop").forEach(function(p){p.hidden=true});

  if((el=e.target.closest("[data-tab]"))){
    var t=el.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===t)});
    $("#v-deck").hidden=(t!=="deck"); $("#v-shop").hidden=(t!=="shop");
    if(t==="shop") renderShop();
    return;
  }
  if((el=e.target.closest("[data-deck]"))){cur=el.dataset.deck;openSlot=null;renderDeck();return}
  if((el=e.target.closest("[data-grp]"))){var k=cur+"|"+el.dataset.grp;openGroups[k]=!openGroups[k];renderGroups();return}
  if((el=e.target.closest("[data-more]"))){expanded[cur+"|"+el.dataset.more]=true;renderGroups();return}
  if((el=e.target.closest("[data-expand]"))){openSlot=(openSlot===el.dataset.expand)?null:el.dataset.expand;renderGroups();return}

  if((el=e.target.closest("[data-pick]"))){
    var b=el.dataset.pick.split("|"),s=find(b[0]),key=b[1],own=b[2]==="1";
    if(own){ toast("Shell only &mdash; slotting an owned card writes a transfer record and re-runs the Tier check."); return }
    var cd=s.cands[key];
    if(cd.loc.charAt(0)==="d"&&cd.loc!=="deck"){
      var other=DECKS[cd.loc];
      if(!confirm("Pull "+cd.name+" out of Deck "+other.no+" \u00B7 "+other.name+"?\n\nThat deck loses this card and its slot becomes a hole until you replace or rebuy it.")) return;
      var hole=punch(other.id,cd.name,cur); cd.loc="deck"; s.pick=key; s.inBox=true;
      toast("Pulled <b>"+esc(cd.name)+"</b> from Deck "+other.no+(hole?". Deck "+other.no+" slot "+hole+" is now a hole.":"."));
    } else {
      s.pick=key; s.inBox=(cd.loc!=="buy"&&cd.loc!=="ordered");
      toast(cd.loc==="buy"?"Slot set to <b>"+esc(cd.name)+"</b> &mdash; added to the Shop list at "+money(cd.price)+"."
        :cd.loc==="ordered"?"Slot set to <b>"+esc(cd.name)+"</b> &mdash; ordered, so the box stays empty until it lands."
        :"Slot set to <b>"+esc(cd.name)+"</b>.");
    }
    renderDeck(); return;   /* the rail stays open */
  }
  if((el=e.target.closest("[data-card]"))){openCard(find(el.dataset.card));return}
  if((el=e.target.closest("[data-bench]"))){
    var sb=find(el.dataset.bench),was=pickOf(sb),prev=predOf(sb,sb.pick);
    was.loc="bench"; sb.pick=prev||"none"; sb.inBox=sb.pick!=="none"&&pickOf(sb).loc==="deck";
    toast("<b>"+esc(was.name)+"</b> is on the Bench. "+(prev
      ? "This slot fell back to <b>"+esc(sb.cands[prev].name)+"</b> ("+RUNGLAB[prev]+")."
      : "This slot is now empty &mdash; pick a rung or slot something you own."));
    renderDeck(); return;
  }
  if((el=e.target.closest("[data-slotit]"))){
    var q=el.dataset.slotit.split("|"),dk=q[0],sid=q[1],nm=q[2];
    cur=dk; var ss=find(sid);
    rungsOf(ss).forEach(function(r){ if(ss.cands[r].name===nm){ss.pick=r;ss.cands[r].loc="deck";ss.inBox=true} });
    closeDrawer(); renderDeck();
    toast("<b>"+esc(nm)+"</b> slotted into Deck "+DECKS[dk].no+" &middot; "+sid.toUpperCase()+".");
    return;
  }
  if((el=e.target.closest("[data-step] button"))&&el.dataset.d){
    var st=el.closest("[data-step]"),s2=find(st.dataset.step);
    s2.qty=Math.max(0,s2.qty+ +el.dataset.d); renderDeck(); return;
  }

  /* --- shop --- */
  if((el=e.target.closest("[data-fdrop]"))){
    var id="pop-"+el.dataset.fdrop,pop=$("#"+id),was2=pop.hidden;
    document.querySelectorAll(".pop").forEach(function(p){p.hidden=true});
    pop.hidden=!was2; return;
  }
  if((el=e.target.closest("[data-fall]"))){SF[el.dataset.fall]=distinct(el.dataset.fall);renderShop();return}
  if((el=e.target.closest("[data-fnone]"))){SF[el.dataset.fnone]=[];renderShop();return}
  if((el=e.target.closest("[data-unchip]"))){
    var u=el.dataset.unchip.split("|");SF[u[0]]=SF[u[0]].filter(function(v){return v!==u[1]});renderShop();return}
  if((el=e.target.closest("[data-clearall]"))){FILTERS.forEach(function(f){SF[f[0]]=[]});SF.q="";renderShop();return}
  if((el=e.target.closest("[data-view]"))){SF.view=el.dataset.view;renderShop();return}
  if((el=e.target.closest("[data-sort]"))){
    var k2=el.dataset.sort;
    if(SF.sortKey===k2) SF.sortDir=(SF.sortDir==="asc"?"desc":"asc"); else {SF.sortKey=k2;SF.sortDir="asc"}
    renderShop(); return;
  }
  if((el=e.target.closest("[data-tri] button"))){
    e.stopPropagation();
    setAcq(el.closest("[data-tri]").dataset.tri, el.dataset.s);
    if($("#v-shop").hidden){ renderDeck(); if(!$("#drawer").hidden) closeDrawer() } else renderShop();
    return;
  }
  if((el=e.target.closest("[data-row]"))){
    var nm2=el.dataset.row,found=null;
    Object.keys(DECKS).forEach(function(k){allSlots(k).forEach(function(s){
      if(s.pick!=="none"&&pickOf(s).name===nm2&&!found)found=s})});
    if(found) openCard(found); return;
  }
  if((el=e.target.closest("[data-close]"))||e.target.id==="scrim"){closeDrawer();return}
  if((el=e.target.closest("[data-act]"))){
    var a=el.dataset.act;
    if(a==="bench") openBench();
    if(a==="merge") toast("<b>Merge purchases</b> &mdash; unions owned counts and paid prices only. Slot picks are never touched, so your in-person marks survive.");
    if(a==="loadactive") toast("<b>Load Active</b> &mdash; full replace of slot picks from the repo. Today this silently wipes in-person marks; that is the bug Merge fixes.");
    if(a==="variant") toast("Shell only &mdash; opens Compare, where the slot goes back to 1&#8209;of&#8209;25.");
    return;
  }
});
document.addEventListener("change",function(e){
  var b=e.target.closest("[data-box]");
  if(b){ var s=find(b.dataset.box); s.inBox=b.checked;
    toast(b.checked?"<b>"+esc(pickOf(s).name)+"</b> marked as sleeved."
                   :"<b>"+esc(pickOf(s).name)+"</b> unchecked &mdash; the box has a hole in this slot.");
    renderRail(); renderDeckCard(); return; }
  var f=e.target.closest("[data-fchk]");
  if(f){ var p=f.dataset.fchk.split("|"),arr=SF[p[0]];
    if(f.checked){ if(arr.indexOf(p[1])<0) arr.push(p[1]) } else SF[p[0]]=arr.filter(function(v){return v!==p[1]});
    renderShop(); var pop=$("#pop-"+p[0]); if(pop) pop.hidden=false; return; }
  if(e.target.id==="gsel"){ SF.groupBy=e.target.value; renderShop(); return }
  if(e.target.id==="ssel"){ SF.sortKey=e.target.value; renderShop(); return }
});
document.addEventListener("input",function(e){
  if(e.target.id==="fq"){ SF.q=e.target.value; renderShop();
    var box=$("#fq"); if(box){box.focus();box.setSelectionRange(box.value.length,box.value.length)} }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDrawer();
  document.querySelectorAll(".pop").forEach(function(p){p.hidden=true})}});

renderDeck(); renderShop();
})();
</script>
