name: Tests

# Every Node suite, once per pull request when it is marked ready, and on every push to main.
#
# There was no test workflow at all before this: the suites existed and ran on somebody's
# machine when somebody remembered. That is how tools/sim/rate-decks.mjs came to read a
# file that had moved months earlier -- every suite passed the whole time, on a laptop,
# checking the file the generator had once written and never the generator.
#
# Chromium is installed so tests/browser-geometry.mjs runs for real. That suite skips
# itself when no browser is present, which is right for a contributor with a plain Node
# install and wrong for CI, so GEOMETRY_REQUIRED turns the skip into a failure here.

#
# HOW OFTEN, AND WHY NOT MORE. The repository is private on GitHub's free plan: Actions has a
# monthly allowance of minutes and a $0 budget, and a run costs about 22 of them (5 to install
# Chromium, 17 for the suites). Running on every push to every branch *and* on every
# pull_request update ran each PR commit twice and spent the month's allowance in under a
# week (2026-09-27), after which no job starts at all.
#
# This run is the gate (Rob, 2026-10-01: "decrease the # of scans avoiding those that are
# redundant ... Prefer to leave with github"). The builder runs only the suites a change
# touches and the secret scan before a push (AGENTS.md, "Merging to main"), never the whole
# suite again, and one run per PR is enough: a draft PR is not run; marking it ready runs it
# once, and a push to a ready PR runs it again; a newer commit cancels the run it replaces.
# Main is run after a merge unless the merge's tree is exactly its PR head's -- that tree was
# just run on the PR, and a PR merges only on a green run of its head. A job is stopped at 45
# minutes: on 2026-10-01 one hung installing Chromium for four hours, spending minutes and
# holding every later run of main in the queue behind it. When the allowance is spent,
# tools/local-ci.sh is this workflow on the builder's machine (AGENTS.md, "Merging to main").

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEOMETRY_REQUIRED: "1"
      PAGE_BUDGET_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A merge to main whose tree is its PR head's, exactly, was run on the PR: skip the
      # repeat. Anything else on main still runs -- a merge that main had moved under, a
      # squash, a commit Load Live or the game-log compiler makes.
      - name: Already run on its pull request?
        id: repeat
        if: github.event_name == 'push'
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This merge's tree is its PR head's ($(git rev-parse --short HEAD^2)), which ran green on the PR; not run again."
          else
            echo "Not a merge of an up-to-date PR head; running every suite."
          fi

      - uses: actions/setup-node@v4
        if: steps.repeat.outputs.skip != 'true'
        with:
          node-version: "22"

      # No package.json on purpose -- the app itself has no dependencies. Playwright is
      # installed here alone, for the one suite that drives a browser.
      - name: Install Playwright and Chromium
        if: steps.repeat.outputs.skip != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium

      # tests/generators.mjs runs the workbook importer's --check against data/source/, which
      # reads .xlsx through openpyxl; without it that one check skips itself, and here it
      # should not.
      - uses: actions/setup-python@v5
        if: steps.repeat.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install the workbook reader
        if: steps.repeat.outputs.skip != 'true'
        run: pip install openpyxl

      - name: Run every suite
        if: steps.repeat.outputs.skip != 'true'
        run: bash runtests.sh -q
      - name: Commander companion tests
        if: steps.repeat.outputs.skip != 'true'
        run: node --test game/tests/*.test.mjs
