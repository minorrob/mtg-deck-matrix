<div class="v-user-functions">
  <button class="v-button" id="v-user-functions-button" type="button" aria-expanded="false" aria-controls="v-user-functions-menu">User Functions <span aria-hidden="true">⌄</span></button>
  <div id="v-user-functions-menu" class="v-user-functions-menu" hidden>
    <p class="v-small">Design preview · sample data</p>
    <button type="button" data-user-function="export"><strong>Export a backup</strong><span>All decks, collection and plans in one file</span></button>
    <button type="button" data-user-function="import"><strong>Import a backup</strong><span>Review and restore a saved library</span></button>
    <button type="button" data-user-function="excel"><strong>Export to Excel</strong><span>Enriched card library and deck plans</span></button>
    <hr>
    <button type="button" data-user-function="default"><strong>Load default</strong><span>Review the supplied example decks</span></button>
    <button type="button" data-user-function="undo" disabled><strong>Undo the last load</strong><span>No load to undo in this preview</span></button>
    <hr>
    <button type="button" data-user-function="reset"><strong>Reset picks</strong><span>Keep your collection and added decks</span></button>
    <button type="button" data-user-function="clear" class="v-user-danger"><strong>Clear all data</strong><span>Back up first, then review what will be removed</span></button>
  </div>
</div>
