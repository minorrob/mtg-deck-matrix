<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrankMagic Online</title><link rel="icon" href="/crankmagic-logo.webp"><link rel="stylesheet" href="/review.css"><link rel="stylesheet" href="/mats.css"><link rel="stylesheet" href="/setup.css"><link rel="stylesheet" href="/online.css"></head>
<body><header><div class="brand"><img src="/crankmagic-logo.webp" alt=""><div class="wordmark"><strong>CrankMagic</strong><small>ONLINE</small></div></div><div class="preview">RECORDED TABLE</div><a class="workshop-link" href="/app/#decks" target="_blank" rel="noopener">Deck workshop ↗</a><button id="view-deck">Your deck</button><button id="view-hand">View hand</button><button id="setup">Game setup</button></header>
<div class="replaybar"><div><span class="live-dot"></span><strong id="phase">Loading recorded game…</strong><span id="position"></span></div><div class="scrubber"><button id="prev" aria-label="Previous recorded phase">‹</button><input id="timeline" type="range" min="0" value="0" aria-label="Recorded phase"><button id="next" aria-label="Next recorded phase">›</button></div></div>
<main><div class="table"><div class="arena"><section id="seat-1" class="seat west tone-1"></section><section id="seat-2" class="seat north tone-2"></section><section id="seat-3" class="seat east tone-3"></section>
<section class="center-counter" aria-label="Shared life manager"><div class="phone-label"><span>TABLE TOTALS</span><small>Tap a player for damage</small></div><div id="counter" class="counter-grid"></div><div class="phone-bottom">Life · Poison · Commander damage</div></section>
<section id="seat-0" class="seat south tone-0"></section></div><section class="hand"><div class="hand-label"><strong>Your hand</strong><span id="hand-count"></span><small>Click a card to inspect</small></div><div id="hand-host"></div></section></div>
<aside><div class="aside-title">CARD INSPECTOR <button id="clear-inspect" aria-label="Clear inspector">×</button></div><div id="inspector" class="inspector"></div><div class="log-header"><strong>Table events</strong><span id="event-count"></span></div><div id="events" class="events"></div></aside></main>
<footer><span id="notice"></span><a href="https://magic.wizards.com/en/rules" target="_blank" rel="noreferrer">Rules reference ↗</a></footer>
<dialog id="focus" class="focus-dialog" aria-labelledby="focus-title"><div class="focus-header"><div><div class="focus-eyebrow">FOCUSED BOARD · ENGINE REPLAY</div><h2 id="focus-title"></h2></div><label class="focus-size">Card size <input id="focus-size" type="range" min="120" max="260" step="10" value="180"><output id="focus-size-value" for="focus-size">180 px</output></label><button id="close-focus" autofocus>Close focus ×</button></div><div id="focus-status" class="focus-status"></div><div id="focus-content" class="focus-content"></div></dialog>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close-detail" aria-label="Close dialog">×</button></div><div id="detail-body"></div></dialog>
<dialog id="card-detail" class="card-dialog"><div class="dialog-head"><h2>Card inspection</h2><button id="close-card" aria-label="Close card inspection">×</button></div><div id="card-detail-body" class="inspector"></div></dialog>
<script type="module" src="/review.mjs"></script></body></html>
