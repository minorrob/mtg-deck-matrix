<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#112b24">
  <title>Import Quintorius Cards</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10251f;color:#f4f0e7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:520px;background:#17342b;border:1px solid #315d4d;border-radius:18px;padding:24px;box-shadow:0 16px 50px #0006}
    h1{font-size:1.35rem;margin:0 0 10px}p{line-height:1.45;margin:8px 0;color:#d8e3dd}.ok{color:#9ce0bd;font-weight:800}
  </style>
</head>
<body>
<main>
  <h1>Importing your Quintorius cards…</h1>
  <p id="status">Saving the photographed cards as Purchased on this device.</p>
</main>
<script>
(() => {
  const STORAGE_KEY = "mtg-deck-matrix-state-v1";
  const PURCHASED_VIEW_KEY = "mtg-buy-purchased-mode-v1";
  const names = [
    "Selfless Spirit","Serra Paragon","Remorseful Cleric","Karmic Guide","Guardian Scalelord","Guardian of Faith","Drumbellower","Angel of Indemnity","Moonshaker Cavalry","Naktamun Lorespinner",
    "Anger","Kami of Ancient Law","Venerable Warsinger","Balefire Liege","Conspiracy Theorist","White Orchid Phantom","Sun Titan","Skyclave Apparition","Relic Retriever","Spirit of Resilience",
    "Patchwork Banner","Ao, the Dawn Sky","Claim Jumper","Containment Construct","Millikin","Primary Research","Tocasia's Welcome","Monologue Tax","Quintorius, Field Historian","Squee, Goblin Nabob","Teshar, Ancestor's Apostle","Kirol, History Buff","Quintorius, Loremaster","Hofri Ghostforge","Laelia, the Blade Reforged","Atsushi, the Blazing Sky","Excava, the Risen Past","Bitterthorn, Nissa's Animus",
    "Terramorphic Expanse","Fields of Strife","Glittering Massif","Furycalm Snarl","Clifftop Retreat","Battlefield Forge","Rugged Prairie","Sunscorched Divide","Temple of Triumph","Radiant Summit","Emeria, the Sky Ruin","Turbulent Steppe","Lotus Field","Command Tower","Exotic Orchard","Fabled Passage",
    "Rip Apart","Faithless Looting","Secret Rendezvous","Seize the Spoils","Tragic Arrogance","Sevinne's Reclamation","Wave of Reckoning","Fellwar Stone","Arcane Signet","Sol Ring","Currency Converter","Archaeomancer's Map","Staff of the Storyteller","Mind Stone","Perpetual Timepiece","Swords to Plowshares","Path to Exile","Lorehold Charm",
    "Lorehold Spirit (Secrets of Strixhaven Commander)"
  ];
  const itemKey = (value) => String(value || "").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  let state = {};
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; } catch (_) {}
  state.found = state.found && typeof state.found === "object" ? state.found : {};
  names.forEach((name) => { state.found[itemKey(name)] = true; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  localStorage.setItem(PURCHASED_VIEW_KEY, "purchased");
  localStorage.setItem("mtg-owned-quintorius-import-v1", JSON.stringify({count:names.length, importedAt:new Date().toISOString()}));
  document.getElementById("status").innerHTML = `<span class="ok">✓ ${names.length} owned entries saved.</span><br>Returning to Trey’s Deck Matrix…`;
  setTimeout(() => location.replace("./"), 750);
})();
</script>
</body>
</html>
