    detail: { what: "Card pictures.", live: "Always live from Scryfall's CDN", lifetime: "The browser's HTTP cache and the worker's image cache", refresh: "Never stored by us", terms: "Wizards' and the artists' work, served by Scryfall" }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "The printing.", example: "5f8287b1-…", source: "Scryfall", joins: { to: rec:scryfall.card.id, cardinality: "one to one" } }
      - { name: normal, type: url, core: true, required: true, meaning: "The card picture.", example: "https://cards.scryfall.io/normal/…", source: "Scryfall", match: 'normal' }
      - { name: art_crop, type: url, core: true, required: false, meaning: "The artwork alone.", example: "https://cards.scryfall.io/art_crop/…", source: "Scryfall", match: 'art_crop' }
