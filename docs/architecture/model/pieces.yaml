# The pieces the M11 architecture page draws: CrankMagic's own kinds, over engram's graph.
#
# One entry per piece. docs/architecture/map.sh reads this file twice:
#   - for the CURRENT map (docs/architecture/.kg), a piece is emitted only when its `current` probe
#     matches the code today (a regex in a file engram mapped), with an `evidenced-by` edge to that
#     file's node. D1 tables and fields and the Worker's routes are parsed from the code directly.
#   - for the FINAL model (docs/architecture/.kg/final), a piece is emitted when it lists `final`
#     requirement ids from model/intent.yaml, with `status: intent` and a `traces-to` edge to each.
# The page's status for a piece (final, current, or both) is its membership in those two graphs,
# never a flag in this file. When a milestone lands, its probe starts to match and the next run
# marks the piece as both; nothing in the drawings changes.
#
# Field rules for tables: `core: true` marks the four to six fields the diagram shows. A field is
# current when its table is and its own probe matches (default: its name as a word in the table's
# evidence file); `current: false` marks a field the final state adds.

lanes:
  network:
    - { id: device,   title: "Your device",              blurb: "The browser on a phone or a desktop, and what it keeps." }
    - { id: edge,     title: "Cloudflare edge",          blurb: "crankmagic.com: the sign-in check, the Worker and the app's files." }
    - { id: platform, title: "Cloudflare data and rooms", blurb: "Where the cloud keeps things: D1, R2 and the game rooms." }
    - { id: pipeline, title: "GitHub",                   blurb: "The private repository, the tests and the scheduled data job." }
    - { id: outside,  title: "Outside services",         blurb: "Other companies' data and services. Their content is their IP." }
    - { id: operator, title: "Rob, the operator",        blurb: "Invites, secrets, approvals and deploys." }
    - { id: retired,  title: "Being retired",            blurb: "Exists today, has no place in the final state." }
  schema:
    - { id: d1,      title: "D1: accounts",                 blurb: "The cloud database. One row per person, their library's versions, and a head." }
    - { id: d1-play, title: "D1: tables and the AI door",   blurb: "Added by Play (M5) and the AI door (M6)." }
    - { id: library, title: "The library, in the browser",  blurb: "IndexedDB on the reader's device. The cloud keeps copies of it as snapshots." }
    - { id: cache,   title: "The reader's cache",           blurb: "What the browser keeps from outside sources, each with a lifetime." }
    - { id: stores,  title: "Stored by us, refreshed",      blurb: "Only where live cannot do the job (plan-data-sync §0)." }
    - { id: room,    title: "The game room",                blurb: "One Durable Object per match, running CME." }
    - { id: outside, title: "Outside sources",              blurb: "Tables whose content is another company's IP, color-coded by source." }
  origins:
    - { id: ours,     title: "Ours" }
    - { id: scryfall, title: "Scryfall" }
    - { id: edhrec,   title: "EDHREC" }
    - { id: mtgjson,  title: "MTGJSON" }
    - { id: wizards,  title: "Wizards of the Coast" }

# ─────────────────────────────── Network nodes ───────────────────────────────
nodes:
  - id: net:browser
    kind: NetworkNode
    name: The app in your browser
    final: [M1-design, S2-sync]
    current: { file: index.html, match: 'crankmagic-app\.js' }
    realizes: web
    place: { network: { lane: device, order: 1 } }
    detail:
      what: "The pages and modules that make CrankMagic, running on the reader's phone or computer. A deck, a library and Explore all work without an account."
      protocol: "HTTPS from crankmagic.com"
      owner: "Ours"
      plan: "M1 restyles it to r3"

  - id: net:service-worker
    kind: NetworkNode
    name: Service worker
    final: [M2-offline, M2-live-first]
    current: { file: crankmagic-sw.js, match: 'SHELL_CACHE' }
    realizes: web
    place: { network: { lane: device, order: 2 } }
    detail:
      what: "A small script the browser keeps beside the app. It saves the app's files and the data sets so the app opens and works offline."
      today: "Precaches the shell and the data files by their ?v= pins."
      final: "Keeps the last good copy of each dated data set named by current.json, and a size-limited image cache."
      plan: "M2"

  - id: net:indexeddb
    kind: NetworkNode
    name: IndexedDB
    final: [S2-sync, M2-live-first]
    current: { file: collection-repository.js, match: 'crankmagic-library' }
    realizes: reader-cache
    place: { network: { lane: device, order: 3 } }
    detail:
      what: "The browser's own database. It holds the library and, in the final state, the card records fetched from Scryfall with their lifetimes."
      owner: "The reader's device"

  - id: net:access
    kind: NetworkNode
    name: Cloudflare Access
    final: [S2-access, M3-invite]
    current: { file: cloud/access.mjs, match: 'Cf-Access-Jwt-Assertion' }
    place: { network: { lane: edge, order: 1 } }
    detail:
      what: "Cloudflare's sign-in gate in front of /api/*. It lets through only people on the Invited list and hands the Worker a signed token naming them."
      auth: "Google sign-in; an emailed one-time code for library sync only"
      owner: "Rob manages the Invited list in the Zero Trust dashboard"
      terms: "The free plan caps Access at 50 people"

  - id: net:access-ai
    kind: NetworkNode
    name: Access for the AI door
    final: [M6-door]
    place: { network: { lane: edge, order: 2 } }
    detail:
      what: "A second Access application, only for the AI routes. Google with passkey MFA where the plan offers it, and never the emailed code."
      plan: "M6"

  - id: net:worker
    kind: NetworkNode
    name: The crankmagic Worker
    final: [S2-sync, M2-serve, M5-front-door, M6-door, M3-rate-limits]
    current: { file: tools/release-pages.mjs, match: 'main: "cloud/worker\.mjs"' }
    realizes: worker
    place: { network: { lane: edge, order: 3 } }
    detail:
      what: "A small program at Cloudflare's edge. It answers /api/* for accounts, and in the final state also /data/* from R2, the table front door, imports and the AI door. Every other path is a plain file."
      protocol: "HTTPS; bindings to D1, R2 and the game rooms"
      auth: "Checks the Access token again on every request: signature, audience, issuer, expiry and a named person"
      today: "Runs for /api/* only, with D1"
      plan: "M2 adds /data/*, M3 rate limits and delete, M5 tables, M6 the AI door"

  - id: net:assets
    kind: NetworkNode
    name: The app's files
    final: [S1-release, M1-design]
    current: { file: tools/release-pages.mjs, match: 'binding: "ASSETS"' }
    realizes: worker
    place: { network: { lane: edge, order: 4 } }
    detail:
      what: "The released pages, scripts, styles and pictures, served straight from Cloudflare without running any code."
      policy: "The security policy lets the page load scripts and fonts only from this site"
      plan: "Built from one commit of main by tools/release-pages.mjs"

  - id: net:analytics
    kind: NetworkNode
    name: Web Analytics
    final: [M3-monitoring]
    current: { file: tools/release-pages.mjs, match: 'static\.cloudflareinsights\.com' }
    realizes: observability
    place: { network: { lane: edge, order: 5 } }
    detail:
      what: "Cloudflare's privacy-first page counts. Its beacon reports to this site's own address."
      owner: "Rob asked for it on 2026-09-24"

  - id: net:d1
    kind: NetworkNode
    name: D1 database
    final: [S2-sync, M5-front-door, M6-door]
    current: { file: tools/release-pages.mjs, match: 'd1_databases' }
    realizes: d1
    place: { network: { lane: platform, order: 1 } }
    detail:
      what: "Cloudflare's SQL database. Production is `crankmagic`, staging is `crankmagic-staging`."
      protocol: "A binding the Worker calls; nothing else reaches it"
      today: "users, snapshots, heads"
      plan: "M5 adds tables and seats, M6 the AI allowlist and call log"

  - id: net:r2
    kind: NetworkNode
    name: R2 bucket
    final: [M2-schedule, M2-serve, M5-definitions, M3-backups]
    realizes: r2
    place: { network: { lane: platform, order: 2 } }
    detail:
      what: "Cloudflare's file storage. It holds each good data run under a dated key, a small current.json naming the newest, the card definitions and the nightly database copy."
      plan: "M2. Rob turns R2 on and makes its token"
      terms: "Free tier: 10 GB-month, 1 million writes and 10 million reads a month, free egress"

  - id: net:game-rooms
    kind: NetworkNode
    name: Game rooms
    final: [M5-room, M5-transport, M5-hidden]
    realizes: game-room
    place: { network: { lane: platform, order: 3 } }
    detail:
      what: "One Durable Object per match: a single place in the cloud that runs the engine, keeps the authoritative game and sends each seat only what that seat may see."
      protocol: "WebSocket through the Worker"
      plan: "M5. Likely needs Workers Paid ($5 a month) once the engine's CPU per request passes 10 ms"

  - id: net:github
    kind: NetworkNode
    name: The repository
    final: [S1-release]
    current: { file: AGENTS.md, match: 'release/pages' }
    place: { network: { lane: pipeline, order: 1 } }
    detail:
      what: "minorrob/mtg-deck-matrix, private. main holds everything; release/pages records each production build."

  - id: net:actions
    kind: NetworkNode
    name: GitHub Actions
    final: [S1-release, M2-schedule, M2-adjudication]
    current: { file: .github/workflows/tests.yml, match: 'runtests\.sh' }
    realizes: refresh
    place: { network: { lane: pipeline, order: 2 } }
    detail:
      what: "GitHub's runners. Today they run the test gate on every push. In the final state they also run the data refresh on a schedule and the weekly rules check."
      terms: "A private repository gets 2,000 free minutes a month; CI plus the refresh is about 300 a month more"
      plan: "M2"

  - id: net:cf-dashboard
    kind: NetworkNode
    name: Cloudflare dashboard
    final: [M3-invite]
    current: { file: docs/handoff-2026-09-25.md, match: 'Zero Trust' }
    place: { network: { lane: operator, order: 1 } }
    detail:
      what: "Where Rob invites people, sets Email Routing and zone settings, and enters Worker secrets. These stay his, in a browser."

  - id: net:cloud-session
    kind: NetworkNode
    name: A cloud session
    final: [S1-release]
    current: { file: docs/handoff-2026-09-25.md, match: 'Working from a cloud session' }
    place: { network: { lane: operator, order: 2 } }
    detail:
      what: "A Claude Code session in a cloud container. It builds, tests and deploys with an API credential the environment holds, so no step needs Rob's laptop."
      auth: "An account-scoped Cloudflare API token, injected by the environment; never typed into chat"

  - id: net:email-routing
    kind: NetworkNode
    name: admin@crankmagic.com
    final: [S1-one-address]
    current: { file: tools/release-pages.mjs, match: 'admin@crankmagic\.com' }
    place: { network: { lane: operator, order: 3 } }
    detail:
      what: "The only public address. Cloudflare Email Routing forwards it to Rob; where it forwards is set in the dashboard and kept out of the repository."

  # Retiring: exists today, no place in the final state
  - id: net:laptop
    kind: NetworkNode
    name: Rob's laptop
    current: { file: AGENTS.md, match: 'Personal-HP' }
    place: { network: { lane: retired, order: 1 } }
    detail:
      what: "Personal-HP, where the data refresh and releases used to run by hand, and where the local game host and Forge live."
      final: "Nothing in the final state needs it: data refreshes on a schedule and deploys run from a cloud session."
      plan: "M2 and M9"

  - id: net:local-host
    kind: NetworkNode
    name: The local game host
    current: { file: index.html, match: '127\.0\.0\.1:8768' }
    place: { network: { lane: retired, order: 2 } }
    detail:
      what: "The Windows host that serves a Forge-backed table at 127.0.0.1:8768. Frozen; the cloud game rooms replace it."
      plan: "M9 retires it"

  - id: net:forge
    kind: NetworkNode
    name: Forge
    current: { file: game/server/local-table-runtime.mjs, match: 'Forge' }
    place: { network: { lane: retired, order: 3 } }
    detail:
      what: "The open-source rules engine the local host drives through Java. CME replaces it; nothing from Forge comes into CME."
      plan: "M9"

  - id: net:tunnel
    kind: NetworkNode
    name: The trycloudflare tunnel
    current: { file: index.html, match: 'trycloudflare' }
    place: { network: { lane: retired, order: 4 } }
    detail:
      what: "A temporary public address that let remote guests reach the local host. The security policy still allows it on main."
      plan: "M9"

  - id: net:github-pages
    kind: NetworkNode
    name: github.io
    current: { file: index.html, match: 'github\.io' }
    place: { network: { lane: retired, order: 5 } }
    detail:
      what: "The app's first address. GitHub Pages was turned off on 2026-09-25; main still names the address in a few places."
      plan: "Housekeeping: retire github.io from main"

  - id: net:load-live
    kind: NetworkNode
    name: The Load Live workflow
    current: { file: .github/workflows/live-load.yml, match: 'live-state\.json' }
    place: { network: { lane: retired, order: 6 } }
    detail:
      what: "A workflow that rebuilt Rob's library files from his workbook for the site to fetch. Load Live went on 2026-09-24; the files are never served."
      plan: "M3 decides how the workbook reaches his account; M9 freezes the workflow"

  # ─────────────────────────────── Outside sources ───────────────────────────────
  - id: src:scryfall-api
    kind: OutsideSource
    name: Scryfall API
    origin: scryfall
    final: [M2-live-first, M2-csp]
    current: { file: scryfall-client.js, match: 'api\.scryfall\.com' }
    place: { network: { lane: outside, order: 1 } }
    detail:
      what: "Card records, prices, rulings and legality, one card at a time."
      live: "Live: read when a card is opened or added"
      terms: "A descriptive User-Agent, about ten requests a second at most, and bulk files for bulk pulls"

  - id: src:scryfall-cdn
    kind: OutsideSource
    name: Scryfall images
    origin: scryfall
    final: [M2-images]
    current: { file: index.html, match: 'cards\.scryfall\.io' }
    place: { network: { lane: outside, order: 2 } }
    detail:
      what: "cards.scryfall.io and svgs.scryfall.io: card pictures and mana symbols."
      live: "Always live; never stored by us"
      lifetime: "The browser's HTTP cache, and the worker's image cache with a size limit"

  - id: src:scryfall-bulk
    kind: OutsideSource
    name: Scryfall bulk files
    origin: scryfall
    final: [M2-schedule, M2-stores]
    current: { file: tools/refresh.mjs, match: 'commander-universe' }
    place: { network: { lane: outside, order: 3 } }
    detail:
      what: "Daily files of every card (oracle_cards, default_cards). The scheduled job reads them, never a reader's browser."
      refresh: "Daily"
      terms: "Scryfall asks that bulk pulls use these files"

  - id: src:edhrec
    kind: OutsideSource
    name: EDHREC
    origin: edhrec
    final: [M2-stores, M2-terms]
    current: { file: edhrec-client.js, match: 'json\.edhrec\.com' }
    place: { network: { lane: outside, order: 4 } }
    detail:
      what: "Commander popularity, themes and which cards are played together."
      live: "Stored: EDHREC has no public API and is not built for live traffic from an app"
      refresh: "Weekly, gently, by the scheduled job"

  - id: src:mtgjson
    kind: OutsideSource
    name: MTGJSON
    origin: mtgjson
    final: [M1-precons]
    place: { network: { lane: outside, order: 5 } }
    detail:
      what: "Precon decklists and set data, as bulk files."
      refresh: "Weekly"

  - id: src:archidekt
    kind: OutsideSource
    name: Archidekt
    origin: archidekt
    final: [M1-archidekt]
    current: { file: deck-sources.js, match: 'archidekt' }
    place: { network: { lane: outside, order: 6 } }
    detail:
      what: "A deck-building site. A deck link is read once and the result lands in the person's library."
      live: "Live, through the Worker; never stored"

  - id: src:wizards
    kind: OutsideSource
    name: Wizards of the Coast
    origin: wizards
    final: [M2-adjudication, M4-legality]
    current: { file: game/engine/index.mjs, match: 'CR|Comprehensive' }
    place: { network: { lane: outside, order: 7 } }
    detail:
      what: "The Comprehensive Rules text, release notes and the Commander format page (banned list, Game Changers, brackets)."
      live: "Read at build time by the engine's tooling and when a case is adjudicated; never by a reader's browser"
      terms: "Wizards' texts are read and cited, not redistributed or committed"

  - id: src:anthropic
    kind: OutsideSource
    name: Anthropic API
    origin: anthropic
    final: [M6-door, M7-compiler]
    place: { network: { lane: outside, order: 8 } }
    detail:
      what: "Claude, for the Coach, LLM seats and card compilation. Reached only by the Worker's AI door and the compiler job."
      auth: "A key held as a Worker secret; it never reaches a browser"

  - id: src:google
    kind: OutsideSource
    name: Google sign-in
    origin: google
    final: [S2-access]
    current: { file: docs/handoff-2026-09-25.md, match: 'Google sign-in' }
    place: { network: { lane: outside, order: 9 } }
    detail:
      what: "The identity provider behind Cloudflare Access. CrankMagic never sees a password."

  # ─────────────────────────────── Worker routes ───────────────────────────────
  # The seven live today are parsed from cloud/worker.mjs; listing them here gives them their final-state traces.
  - { id: "route:GET:/api/auth/login", kind: WorkerRoute, name: "GET /api/auth/login", final: [S2-access], hosted: net:worker,
      detail: { what: "After Access signs a person in, sends them back to the app. Only a fragment of this app may be the destination." } }
  - { id: "route:GET:/api/me", kind: WorkerRoute, name: "GET /api/me", final: [S2-sync], hosted: net:worker,
      detail: { what: "Who is signed in, and the library version their devices converge on." } }
  - { id: "route:GET:/api/library", kind: WorkerRoute, name: "GET /api/library", final: [S2-sync], hosted: net:worker,
      detail: { what: "The head: the newest version of this person's library." } }
  - { id: "route:PUT:/api/library", kind: WorkerRoute, name: "PUT /api/library", final: [S2-sync], hosted: net:worker,
      detail: { what: "Saves a version. The head moves only from where this device left it; otherwise the answer is 409 and the person chooses." } }
  - { id: "route:POST:/api/library/kept", kind: WorkerRoute, name: "POST /api/library/kept", final: [S2-sync], hosted: net:worker,
      detail: { what: "Files this device's version without moving the head: the side a person did not keep, held 30 days." } }
  - { id: "route:GET:/api/library/history", kind: WorkerRoute, name: "GET /api/library/history", final: [S2-sync], hosted: net:worker,
      detail: { what: "The versions held, newest first, without their bodies." } }
  - { id: "route:GET:/api/library/versions/:id", kind: WorkerRoute, name: "GET /api/library/versions/:id", final: [S2-sync], hosted: net:worker,
      detail: { what: "One version with its body, only ever the asking person's own." } }
  - { id: "route:DELETE:/api/account", kind: WorkerRoute, name: "DELETE /api/account", final: [M1-delete-account], hosted: net:worker,
      detail: { what: "Deletes the person's snapshots, head and user row after a type-to-confirm dialog. Removing them from Access is Rob's runbook step.", plan: "M1 (R3.3) and M3" } }
  - { id: "route:PUT:/api/me", kind: WorkerRoute, name: "PUT /api/me", final: [M1-notify], hosted: net:worker,
      detail: { what: "Stores account-level switches, such as 'Tell me when Play is ready'.", plan: "M1" } }
  - { id: "route:GET:/data/*", kind: WorkerRoute, name: "GET /data/*", final: [M2-serve], hosted: net:worker,
      detail: { what: "Serves current.json (short cache) and the dated data files (long cache) from R2.", plan: "M2" } }
  - { id: "route:POST:/api/import/archidekt", kind: WorkerRoute, name: "POST /api/import/archidekt", final: [M1-archidekt], hosted: net:worker,
      detail: { what: "Fetches a deck from an Archidekt link, with a size limit, and stores nothing.", plan: "M1 (R3.10)" } }
  - { id: "route:POST:/api/tables", kind: WorkerRoute, name: "POST /api/tables", final: [M5-front-door, M5-lobby], hosted: net:worker,
      detail: { what: "Creates a table and its game room; returns the invite link and QR.", plan: "M5" } }
  - { id: "route:POST:/api/tables/:id/seats", kind: WorkerRoute, name: "POST /api/tables/:id/seats", final: [M5-front-door], hosted: net:worker,
      detail: { what: "Joins or leaves a seat, handing it to the signed-in person. Identity stays out of the engine.", plan: "M5" } }
  - { id: "route:GET:/api/tables/:id/socket", kind: WorkerRoute, name: "GET /api/tables/:id/socket", final: [M5-transport, M5-reconnect], hosted: net:worker,
      detail: { what: "Upgrades to a WebSocket and hands it to the table's game room; a reconnect gets a fresh permitted view.", plan: "M5" } }
  - { id: "route:POST:/api/ai/call", kind: WorkerRoute, name: "POST /api/ai/call", final: [M6-door, M10-finish], hosted: net:worker,
      detail: { what: "The AI door: checks the allowlist and the spend cap, calls the model, and logs the call.", plan: "M6" } }

  # ─────────────────────────────── R2 objects ───────────────────────────────
  - id: r2:data/current.json
    kind: R2Object
    name: current.json
    final: [M2-serve, M2-pin]
    hosted: net:r2
    detail:
      what: "A small file naming the newest good data run: each file's dated key, checksum and date. The app reads it in place of ?v= pins."
      lifetime: "Short cache"
      plan: "M2"
  - id: r2:data/dated
    kind: R2Object
    name: Dated data runs
    final: [M2-schedule, M2-stores]
    hosted: net:r2
    detail:
      what: "Each good run's files under data/<date>/. The last seven runs are kept, so a bad day rolls back by rewriting current.json."
      lifetime: "Long cache; a dated file never changes"
      plan: "M2"
  - id: r2:engine/definitions
    kind: R2Object
    name: Card definitions
    final: [M5-definitions, M7-compiler]
    hosted: net:r2
    detail:
      what: "The engine's card definitions, versioned, loaded by a game room for the version the game pinned."
      plan: "M5 and M7"
  - id: r2:backups/d1
    kind: R2Object
    name: Nightly D1 copy
    final: [M3-backups]
    hosted: net:r2
    detail:
      what: "A nightly export of the D1 database, beside D1's own Time Travel."
      plan: "M3, once M2 turns R2 on"

  # ─────────────────────────────── Durable Object ───────────────────────────────
  - id: do:game-room
    kind: DurableObjectRoom
    name: GameRoom
    final: [M5-room, M5-transport, M5-reconnect, M5-hidden, M4-engine]
    hosted: net:game-rooms
    realizes: game-room
    detail:
      what: "The class each match runs in. It holds the authoritative state, applies each action through CME, writes the journal and checkpoints through the storage adapter, and sends each seat its own view."
      plan: "M4 builds the storage adapter; M5 builds the room"

  # ─────────────────────────────── Secrets (names withheld on the page) ───────────────────────────────
  - { id: secret:cloudflare-api-token, kind: Secret, name: "Deploy credential", variable: CLOUDFLARE_API_TOKEN, final: [S1-release], hosted: net:cloud-session,
      current: { file: docs/handoff-2026-09-25.md, match: 'CLOUDFLARE_API_TOKEN' } }
  - { id: secret:r2-token, kind: Secret, name: "Data job credential", variable: CLOUDFLARE_R2_TOKEN, final: [M2-schedule], hosted: net:actions }
  - { id: secret:anthropic-key, kind: Secret, name: "AI provider key", variable: ANTHROPIC_API_KEY, final: [M6-door], hosted: net:worker }
  - { id: secret:access-service-tokens, kind: Secret, name: "Playtest agents' credentials", variable: "Access service tokens", final: [M8-playtest], hosted: net:access }

# ─────────────────────────────── Network links ───────────────────────────────
links:
  - { from: net:browser, to: net:assets, protocol: HTTPS, auth: "None: public pages", policy: "default-src 'self'", final: [S1-release],
      current: { file: index.html, match: "default-src 'self'" }, description: "Loads the app's pages, scripts and styles." }
  - { from: net:browser, to: net:service-worker, protocol: "In the browser", auth: "Same origin", final: [M2-offline],
      current: { file: crankmagic-app.js, match: 'serviceWorker' }, description: "Registers the worker that keeps files for offline use." }
  - { from: net:browser, to: net:indexeddb, protocol: "In the browser", auth: "Same origin", final: [S2-sync, M2-live-first],
      current: { file: collection-repository.js, match: 'idb\.open' }, description: "Saves every change to the library before it shows." }
  - { from: net:browser, to: net:access, protocol: "HTTPS redirect", auth: "Google, or an emailed code (library only)", final: [S2-access],
      current: { file: crankmagic-account.js, match: 'api/auth/login' }, description: "Signing in, when a person chooses to." }
  - { from: net:access, to: src:google, protocol: "OIDC", auth: "Google account", final: [S2-access],
      current: { file: docs/handoff-2026-09-25.md, match: 'Google sign-in' }, description: "Access asks Google who the person is." }
  - { from: net:browser, to: net:worker, protocol: "HTTPS JSON", auth: "Access token cookie + an x-crankmagic header on writes", policy: "connect-src 'self'", final: [S2-sync, M2-serve, M5-front-door],
      current: { file: crankmagic-account.js, match: 'api/library' }, description: "Library sync today; data files, tables and the AI door in the final state." }
  - { from: net:worker, to: net:access, protocol: "HTTPS (published keys)", auth: "Public signing keys, cached ten minutes", final: [S2-access],
      current: { file: cloud/access.mjs, match: 'cdn-cgi/access/certs' }, description: "The Worker checks each token's signature against the team's keys." }
  - { from: net:worker, to: net:d1, protocol: "D1 binding (SQL)", auth: "Binding: nothing else can reach it", final: [S2-sync, M5-front-door, M6-door],
      current: { file: cloud/worker.mjs, match: 'env\.DB' }, description: "Reads and writes users, snapshots and heads." }
  - { from: net:worker, to: net:r2, protocol: "R2 binding", auth: "Binding", final: [M2-serve], description: "Serves /data/* from the bucket." }
  - { from: net:worker, to: net:game-rooms, protocol: "Durable Object stub + WebSocket", auth: "The Worker hands over a seat only to its Access identity", final: [M5-front-door, M5-transport],
      description: "Creates rooms and passes each player's WebSocket to their table's room." }
  - { from: net:game-rooms, to: net:r2, protocol: "R2 binding", auth: "Binding", final: [M5-definitions, M2-pin], description: "Loads the card definitions and oracle snapshot the game pinned." }
  - { from: net:browser, to: net:game-rooms, protocol: "WebSocket (through the Worker)", auth: "Access identity", final: [M5-transport],
      description: "Ordered view updates and receipts, with no polling." }
  - { from: net:worker, to: src:anthropic, protocol: "HTTPS", auth: "The AI provider key, a Worker secret", final: [M6-door], description: "Only for allowlisted people, under a spend cap, every call logged." }
  - { from: net:browser, to: net:access-ai, protocol: "HTTPS redirect", auth: "Google with MFA; never the emailed code", final: [M6-door], description: "A separate sign-in for the AI features." }
  - { from: net:worker, to: src:archidekt, protocol: "HTTPS", auth: "None", policy: "Size limit; nothing stored", final: [M1-archidekt], description: "Reads a deck by link for the person importing it." }
  - { from: net:browser, to: src:scryfall-api, protocol: "HTTPS (CORS)", auth: "None", policy: "connect-src api.scryfall.com", final: [M2-live-first, M2-csp],
      current: { file: index.html, match: 'connect-src[^"]*api\.scryfall\.com' }, description: "One card at a time, when it is opened or added." }
  - { from: net:browser, to: src:scryfall-cdn, protocol: "HTTPS images", auth: "None", policy: "img-src cards.scryfall.io svgs.scryfall.io", final: [M2-images],
      current: { file: index.html, match: 'img-src[^"]*cards\.scryfall\.io' }, description: "Card pictures and mana symbols." }
  - { from: net:actions, to: src:scryfall-bulk, protocol: HTTPS, auth: "None; descriptive User-Agent", final: [M2-schedule], description: "Daily: every card and its prices." }
  - { from: net:actions, to: src:edhrec, protocol: HTTPS, auth: "None; gentle, weekly", final: [M2-schedule, M2-terms], description: "Weekly: ranks and co-play." }
  - { from: net:actions, to: src:mtgjson, protocol: HTTPS, auth: "None", final: [M1-precons], description: "Weekly: precon decklists." }
  - { from: net:actions, to: src:wizards, protocol: HTTPS, auth: "None", final: [M2-adjudication], description: "A newer Comprehensive Rules date re-checks every citation." }
  - { from: net:actions, to: net:r2, protocol: "R2 API", auth: "The data job credential, a GitHub secret", final: [M2-schedule], description: "Publishes a good run's dated files, then current.json." }
  - { from: net:github, to: net:actions, protocol: "Git events and schedules", auth: "GitHub", final: [S1-release, M2-schedule],
      current: { file: .github/workflows/tests.yml, match: 'on:' }, description: "Every push runs the gate." }
  - { from: net:cloud-session, to: net:worker, protocol: "wrangler deploy (Cloudflare API)", auth: "The deploy credential, an environment secret", policy: "Staging first; production on Rob's go", final: [S1-release],
      current: { file: docs/handoff-2026-09-25.md, match: 'wrangler@4\.139\.0 whoami' }, description: "Deploys the walked build." }
  - { from: net:cloud-session, to: net:github, protocol: "Git over HTTPS", auth: "The session's GitHub access", final: [S1-release],
      current: { file: docs/handoff-2026-09-25.md, match: 'GitHub access' }, description: "Branches, pull requests and release/pages." }
  - { from: net:cf-dashboard, to: net:access, protocol: "Dashboard", auth: "Rob's Cloudflare login", final: [M3-invite],
      current: { file: docs/handoff-2026-09-25.md, match: 'Invited' }, description: "Rob adds a person to the Invited list." }
  - { from: net:browser, to: net:analytics, protocol: "HTTPS beacon", auth: "None", policy: "script-src static.cloudflareinsights.com", final: [M3-monitoring],
      current: { file: tools/release-pages.mjs, match: 'cloudflareinsights' }, description: "Anonymous page counts." }
  # Retiring links
  - { from: net:browser, to: src:edhrec, protocol: "HTTPS (CORS)", auth: "None", policy: "connect-src json.edhrec.com",
      current: { file: index.html, match: 'json\.edhrec\.com' }, description: "Today the browser asks EDHREC directly. In the final state only the scheduled job does." }
  - { from: net:browser, to: src:archidekt, protocol: "HTTPS (CORS)", auth: "None", policy: "connect-src archidekt.com",
      current: { file: index.html, match: 'archidekt\.com' }, description: "Today the browser may reach Archidekt directly. In the final state the Worker does." }
  - { from: net:browser, to: net:local-host, protocol: "HTTP on 127.0.0.1:8768", auth: "Local", current: { file: index.html, match: '127\.0\.0\.1:8768' },
      description: "The local copy of Play, frozen." }
  - { from: net:browser, to: net:tunnel, protocol: "HTTPS", auth: "Invitation link", current: { file: index.html, match: 'trycloudflare' },
      description: "Remote guests reached the local host this way." }
  - { from: net:tunnel, to: net:local-host, protocol: "cloudflared tunnel", auth: "None", current: { file: game/server/guest-gateway.mjs, match: 'tunnel|trycloudflare' },
      description: "The tunnel forwards to the host on Rob's machine." }
  - { from: net:local-host, to: net:forge, protocol: "Java process", auth: "Local", current: { file: game/server/local-table-runtime.mjs, match: 'Forge' },
      description: "The host drives Forge through the adapter." }
  - { from: net:laptop, to: src:scryfall-bulk, protocol: HTTPS, auth: "None", current: { file: tools/refresh.mjs, match: 'commander-universe' },
      description: "Today the refresh runs by hand on a machine, and someone commits the result." }
  - { from: net:laptop, to: net:worker, protocol: "wrangler deploy (browser sign-in)", auth: "Wrangler's OAuth token on the laptop", current: { file: docs/handoff-2026-09-25.md, match: 'WRANGLER=' },
      description: "How deploys ran before the cloud session held a credential." }
  - { from: net:load-live, to: net:github-pages, protocol: "Git push", auth: "GitHub", current: { file: .github/workflows/live-load.yml, match: 'live-state' },
      description: "Load Live published Rob's library files for the site to fetch. Both ends are off." }

# ─────────────────────────────── Tables and records ───────────────────────────────
tables:
  # D1 (parsed from cloud/migrations for the current map)
  - id: d1:users
    kind: D1Table
    name: users
    final: [S2-sync]
    hosted: net:d1
    place: { schema: { group: d1, order: 1 } }
    detail: { what: "One row per person who has signed in.", source: "Cloudflare Access names the person; the Worker writes the row", owner: "Ours; person-level" }
    fields:
      - { name: id, type: INTEGER, core: true, required: true, meaning: "The person's number here.", example: "42", source: "Assigned by D1" }
      - { name: email, type: TEXT, core: true, required: true, meaning: "Who they are, lower-cased, from the Access token.", example: "withheld", source: "Cloudflare Access" }
      - { name: created_at, type: TEXT, core: true, required: true, meaning: "When they first signed in.", example: "2026-09-24T18:02:11Z", source: "The Worker's clock" }
      - { name: seen_at, type: TEXT, core: true, required: true, meaning: "When they were last seen, moved at most hourly to save writes.", example: "2026-09-25T07:40:00Z", source: "The Worker's clock" }
      - { name: notify_play, type: INTEGER, core: false, required: false, current: false, meaning: "The 'Tell me when Play is ready' switch.", example: "1", source: "The person, in the app", final: [M1-notify] }
  - id: d1:snapshots
    kind: D1Table
    name: snapshots
    final: [S2-sync]
    hosted: net:d1
    place: { schema: { group: d1, order: 2 } }
    detail: { what: "Saved versions of a person's library. Each is the app's own checksummed backup, gzipped by the browser. The Worker never opens one.", lifetime: "The newest 20 everyday versions; a displaced or kept version for 30 days" }
    fields:
      - { name: id, type: "TEXT (UUID)", core: true, required: true, meaning: "The version's id, minted by the Worker.", example: "3f2a…c91e", source: "The Worker" }
      - { name: user_id, type: INTEGER, core: true, required: true, meaning: "Whose library this is.", example: "42", source: "The signed-in person", joins: { to: d1:users.id, cardinality: "many to one" } }
      - { name: parent_id, type: TEXT, core: true, required: false, meaning: "The version the device started from; empty for a first save.", example: "9b10…77aa", source: "The device", joins: { to: d1:snapshots.id, cardinality: "many to one" } }
      - { name: kind, type: TEXT, core: true, required: true, meaning: "sync, displaced (replaced by a choice) or kept (the side not chosen).", example: "sync", source: "The Worker" }
      - { name: revision, type: INTEGER, core: true, required: true, meaning: "The device's own revision number when it saved.", example: "318", source: "The device", joins: { to: rec:library.state.revision, cardinality: "one to one" } }
      - { name: device, type: TEXT, required: true, meaning: "How the device describes itself.", example: "withheld", source: "The device" }
      - { name: checksum, type: TEXT, required: true, meaning: "The backup's SHA-256; the browser verifies it on the way back.", example: "a3c4…", source: "The browser" }
      - { name: size, type: INTEGER, required: true, meaning: "Length of the body in characters.", example: "184220", source: "The Worker" }
      - { name: body, type: TEXT, core: true, required: true, meaning: "The whole library, gzipped and base64-encoded.", example: "withheld", source: "The browser" }
      - { name: created_at, type: TEXT, required: true, meaning: "When it was saved.", example: "2026-09-25T07:41:03Z", source: "The Worker's clock" }
  - id: d1:heads
    kind: D1Table
    name: heads
    final: [S2-sync]
    hosted: net:d1
    place: { schema: { group: d1, order: 3 } }
    detail: { what: "For each person, the version every device should converge on. It moves only from where a device left it." }
    fields:
      - { name: user_id, type: INTEGER, core: true, required: true, meaning: "Whose head this is.", example: "42", source: "The signed-in person", joins: { to: d1:users.id, cardinality: "one to one" } }
      - { name: snapshot_id, type: TEXT, core: true, required: true, meaning: "The current version.", example: "3f2a…c91e", source: "The Worker", joins: { to: d1:snapshots.id, cardinality: "one to one" } }
      - { name: updated_at, type: TEXT, core: true, required: true, meaning: "When the head last moved.", example: "2026-09-25T07:41:03Z", source: "The Worker's clock" }
  - id: d1:tables
    kind: D1Table
    name: tables
    final: [M5-front-door, M5-lobby]
    hosted: net:d1
    place: { schema: { group: d1-play, order: 1 } }
    detail: { what: "A table someone is hosting, and the game room that runs it.", plan: "M5" }
    fields:
      - { name: id, type: TEXT, core: true, required: true, meaning: "The table's id, in its invite link.", example: "tbl_7k2q", source: "The Worker" }
      - { name: host_user_id, type: INTEGER, core: true, required: true, meaning: "Who is hosting.", example: "42", source: "The signed-in person", joins: { to: d1:users.id, cardinality: "many to one" } }
      - { name: room_id, type: TEXT, core: true, required: true, meaning: "The Durable Object running the match.", example: "do_91f…", source: "Cloudflare", joins: { to: rec:room.state.room_id, cardinality: "one to one" } }
      - { name: status, type: TEXT, core: true, required: true, meaning: "lobby, countdown, playing or finished.", example: "lobby", source: "The room" }
      - { name: rules, type: "TEXT (JSON)", core: false, required: true, meaning: "The table's rules: bracket, timers, who may join.", example: "{\"bracket\":3}", source: "The host" }
      - { name: created_at, type: TEXT, core: true, required: true, meaning: "When it was set up.", example: "2026-10-12T19:30:00Z", source: "The Worker's clock" }
  - id: d1:seats
    kind: D1Table
    name: seats
    final: [M5-front-door, M5-lobby]
    hosted: net:d1
    place: { schema: { group: d1-play, order: 2 } }
    detail: { what: "Who sits where: a person, the house pilot, or an LLM seat. Invitations are seats with no person yet.", plan: "M5" }
    fields:
      - { name: table_id, type: TEXT, core: true, required: true, meaning: "Which table.", example: "tbl_7k2q", source: "The Worker", joins: { to: d1:tables.id, cardinality: "many to one" } }
      - { name: seat, type: INTEGER, core: true, required: true, meaning: "Seat 1 to 4.", example: "2", source: "The host" }
      - { name: user_id, type: INTEGER, core: true, required: false, meaning: "The person in it; empty for an AI seat or an open invitation.", example: "57", source: "The Access identity that joined", joins: { to: d1:users.id, cardinality: "many to one" } }
      - { name: kind, type: TEXT, core: true, required: true, meaning: "human, house or llm.", example: "human", source: "The host" }
      - { name: invite_token, type: TEXT, core: false, required: false, meaning: "The link or QR code's token for an open human seat.", example: "withheld", source: "The Worker" }
  - id: d1:ai_allowlist
    kind: D1Table
    name: ai_allowlist
    final: [M6-door]
    hosted: net:d1
    place: { schema: { group: d1-play, order: 3 } }
    detail: { what: "The people Rob allows to use AI features. Separate from the invite list.", owner: "Rob manages it", plan: "M6" }
    fields:
      - { name: email, type: TEXT, core: true, required: true, meaning: "Who may use AI.", example: "withheld", source: "Rob", joins: { to: d1:users.email, cardinality: "one to one" } }
      - { name: cap_usd, type: REAL, core: true, required: true, meaning: "Their spend cap per month.", example: "5.00", source: "Rob" }
      - { name: added_at, type: TEXT, core: true, required: true, meaning: "When Rob added them.", example: "2026-11-02T10:00:00Z", source: "The clock" }
      - { name: note, type: TEXT, core: false, required: false, meaning: "Why they are on the list.", example: "Playtester", source: "Rob" }
  - id: d1:ai_calls
    kind: D1Table
    name: ai_calls
    final: [M6-door]
    hosted: net:d1
    place: { schema: { group: d1-play, order: 4 } }
    detail: { what: "A log of every AI call: who, what for, tokens and cost.", plan: "M6" }
    fields:
      - { name: id, type: TEXT, core: true, required: true, meaning: "The call's id.", example: "call_2c1…", source: "The Worker" }
      - { name: user_id, type: INTEGER, core: true, required: true, meaning: "Who made it.", example: "42", source: "The signed-in person", joins: { to: d1:users.id, cardinality: "many to one" } }
      - { name: purpose, type: TEXT, core: true, required: true, meaning: "coach, llm-seat, explain-score or compile.", example: "coach", source: "The feature" }
      - { name: tokens, type: INTEGER, core: true, required: true, meaning: "Tokens in and out.", example: "1840", source: "The provider's reply" }
      - { name: cost_usd, type: REAL, core: true, required: true, meaning: "What it cost.", example: "0.012", source: "Computed from the provider's price" }
      - { name: prompt_digest, type: TEXT, core: false, required: true, meaning: "A hash of what was sent, not the text.", example: "withheld", source: "The Worker" }
      - { name: at, type: TEXT, core: false, required: true, meaning: "When.", example: "2026-11-02T20:14:09Z", source: "The clock" }

  # The library (IndexedDB crankmagic-library, store `state`)
  - id: rec:library.state
    kind: RecordType
    name: library
    final: [S2-sync]
    current: { file: collection-model.js, match: 'schemaVersion:VERSION' }
    hosted: net:indexeddb
    place: { schema: { group: library, order: 1 } }
    detail: { what: "The library as one record: every collection below, a schema version and a revision. A change is saved with its receipt and an undo point in one transaction.", owner: "The reader" }
    fields:
      - { name: schemaVersion, type: integer, core: true, required: true, meaning: "The record's shape; 3 today.", example: "3", source: "The app" }
      - { name: revision, type: integer, core: true, required: true, meaning: "Goes up by one with every saved change.", example: "318", source: "The app" }
      - { name: createdAt, type: date, core: true, required: false, meaning: "When the library was started.", example: "2026-09-02T12:00:00Z", source: "The app" }
      - { name: updatedAt, type: date, core: true, required: false, meaning: "When it last changed.", example: "2026-09-25T07:40:59Z", source: "The app" }
  - id: rec:library.cards
    kind: RecordType
    name: cards
    final: [S2-sync]
    current: { file: collection-model.js, match: 'oracleId' }
    hosted: net:indexeddb
    place: { schema: { group: library, order: 2 } }
    detail: { what: "The cards this library knows, as references: the facts live on the Card record, read from the catalog." }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "Scryfall's id for the printing.", example: "5f8287b1-…", source: "Scryfall", joins: { to: rec:scryfall.card.id, cardinality: "many to one" } }
      - { name: name, type: text, core: true, required: true, meaning: "The printed name.", example: "Sol Ring", source: "Scryfall" }
      - { name: oracleId, type: text, core: true, required: true, meaning: "The card across all printings.", example: "6ad8011d-…", source: "Scryfall", joins: { to: rec:scryfall.card.oracle_id, cardinality: "many to one" } }
      - { name: shipped, type: boolean, core: true, required: true, meaning: "True when the shipped record set carries the card, so only its identity is kept.", example: "true", source: "The app" }
  - id: rec:library.lots
    kind: RecordType
    name: lots
    final: [S2-sync]
    current: { file: collection-model.js, match: 'allocation' }
    hosted: net:indexeddb
    place: { schema: { group: library, order: 3 } }
    detail: { what: "Physical copies, in groups: owned, ordered, watching or to buy, where they sit, and which deck slot they fill." }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "The lot's id.", example: "lot_8w1…", source: "The app" }
      - { name: cardId, type: text, core: true, required: true, meaning: "Which card.", example: "5f8287b1-…", source: "The person", joins: { to: rec:library.cards.id, cardinality: "many to one" } }
      - { name: quantity, type: integer, core: true, required: true, meaning: "How many copies.", example: "2", source: "The person" }
      - { name: source, type: text, core: true, required: true, meaning: "owned, ordered, watching or toBuy.", example: "owned", source: "The person" }
      - { name: allocation.deckId, type: text, core: true, required: false, match: 'deckId', meaning: "The deck these copies are reserved for.", example: "deck_3k…", source: "The person", joins: { to: rec:library.decks.id, cardinality: "many to one" } }
      - { name: allocation.slotId, type: text, core: false, required: false, match: 'slotId', meaning: "The slot they fill.", example: "slot_9d…", source: "The person", joins: { to: rec:library.slots.id, cardinality: "many to one" } }
      - { name: paid, type: number, required: false, meaning: "What was paid per copy.", example: "1.49", source: "The person" }
      - { name: notes, type: text, required: false, meaning: "The person's own notes.", example: "withheld", source: "The person" }
  - id: rec:library.decks
    kind: RecordType
    name: decks
    final: [S2-sync]
    current: { file: collection-model.js, match: 'commanders' }
    hosted: net:indexeddb
    place: { schema: { group: library, order: 4 } }
    detail: { what: "Decks: a commander, a list of slots, a definition (bracket, budget, style) and a status from draft to final." }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "The deck's id.", example: "deck_3k…", source: "The app" }
      - { name: name, type: text, core: true, required: true, meaning: "Its name.", example: "Tempest of Wings", source: "The person" }
      - { name: commanders, type: list, core: true, required: true, meaning: "Its commander or commanders.", example: "[Kykar]", source: "The person", joins: { to: rec:library.cards.id, cardinality: "many to many" } }
      - { name: status, type: text, core: true, required: true, meaning: "draft or final.", example: "final", source: "The person" }
      - { name: version, type: integer, core: true, required: true, meaning: "Goes up when the list is finalized.", example: "4", source: "The app" }
      - { name: groupId, type: text, required: false, meaning: "The collection group the deck belongs to.", example: "group:main-deck", source: "The app", joins: { to: rec:library.groups.id, cardinality: "many to one" } }
  - id: rec:library.slots
    kind: RecordType
    name: slots
    final: [S2-sync]
    current: { file: collection-model.js, match: 'slots' }
    hosted: net:indexeddb
    place: { schema: { group: library, order: 5 } }
    detail: { what: "A deck's hundred: one row per card it calls for. Held inside its deck." }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "The slot's id.", example: "slot_9d…", source: "The app" }
      - { name: deck, type: "parent", core: true, required: true, match: 'slots', meaning: "The deck it belongs to (it is stored inside the deck).", example: "deck_3k…", source: "The app", joins: { to: rec:library.decks.id, cardinality: "many to one" } }
      - { name: cardId, type: text, core: true, required: true, meaning: "The card called for.", example: "5f8287b1-…", source: "The person", joins: { to: rec:library.cards.id, cardinality: "many to one" } }
      - { name: quantity, type: integer, core: true, required: true, meaning: "How many.", example: "1", source: "The person" }
      - { name: committed, type: boolean, core: true, required: false, meaning: "True once the deck is finalized and the slot counts toward To Buy.", example: "true", source: "The app" }
  - id: rec:library.groups
    kind: RecordType
    name: groups
    final: [S2-sync]
    current: { file: collection-model.js, match: 'STARTER_GROUPS' }
    hosted: net:indexeddb
    place: { schema: { group: library, order: 6 } }
    detail: { what: "Collection groups: Main Deck, Bench, To Trade, To Buy, and the person's own." }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "The group's id.", example: "group:bench", source: "The app" }
