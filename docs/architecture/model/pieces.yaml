    hosted: net:r2
    fed: src:scryfall-api
    place: { schema: { group: outside, order: 9 } }
    detail: { what: "The banned list, Game Changers and brackets, as a dated snapshot the engine checks a deck against at prepare.", live: "Per card, with the card record", refresh: "Daily with the metadata", source: "Wizards' Commander page, through Scryfall", plan: "M4" }
    fields:
      - { name: oracle_id, type: text, core: true, required: true, meaning: "The card.", example: "6ad8011d-…", source: "Scryfall", joins: { to: rec:scryfall.card.oracle_id, cardinality: "one to one" } }
      - { name: commander, type: text, core: true, required: true, meaning: "legal or banned.", example: "legal", source: "Wizards", match: 'commander' }
      - { name: game_changer, type: boolean, core: true, required: false, meaning: "On the Game Changers list.", example: "true", source: "Wizards", match: 'game_changer' }
      - { name: date, type: date, core: true, required: true, current: false, meaning: "The snapshot's date.", example: "2026-10-12", source: "The job", final: [M4-legality] }

# ─────────────────────────────── Data flows ───────────────────────────────
flows:
  - id: dflow:library-sync
    name: A library, saved and followed
    final: [S2-sync]
    current: { file: crankmagic-account.js, match: 'api/library' }
    detail: { what: "A change is saved in the browser first, then copied to the cloud, where every other device picks it up. A conflict is put to the person.", freshness: "Seconds after a change", owner: "The person owns their library" }
    steps:
      - { piece: net:browser, action: "A change is made: a card bought, a deck finalized." }
      - { piece: rec:library.state, action: "Saved in IndexedDB with its receipt and an undo point, before it shows." }
      - { piece: net:access, action: "Signed in, the request carries the Access token." }
      - { piece: "route:PUT:/api/library", action: "The library, gzipped and checksummed, is sent with the version it started from." }
      - { piece: d1:snapshots, action: "Stored as a new version." }
      - { piece: d1:heads, action: "The head moves only if no other device saved in between; otherwise the person chooses." }
      - { piece: "route:GET:/api/library", action: "Another device reads the head and restores it, checking the checksum." }
  - id: dflow:card-live
    name: A card, read live
    final: [M2-live-first, M2-csp]
    current: { file: scryfall-client.js, match: 'api\.scryfall\.com' }
    detail: { what: "Opening or adding a card asks Scryfall directly, then keeps the answer with a lifetime.", freshness: "Live; 7 days for a record, 24 hours for a price", owner: "Scryfall's data" }
    steps:
      - { piece: net:browser, action: "A card is opened or added." }
      - { piece: rec:cache.card-records, action: "If a fresh copy is in the reader's cache, it is used and checked in the background." }
      - { piece: src:scryfall-api, action: "Otherwise Scryfall is asked, one card, within its rate." }
      - { piece: rec:scryfall.card, action: "The record and its price arrive." }
      - { piece: rec:cache.card-records, action: "Kept with the time it was read; its age is shown." }
  - id: dflow:images
    name: Card pictures
    final: [M2-images]
    current: { file: index.html, match: 'cards\.scryfall\.io' }
    detail: { what: "Pictures always come from Scryfall's CDN and are never stored by us.", freshness: "Live", owner: "Wizards and the artists, served by Scryfall" }
    steps:
      - { piece: net:browser, action: "A card is drawn on screen." }
      - { piece: src:scryfall-cdn, action: "Its picture is loaded from cards.scryfall.io." }
      - { piece: net:service-worker, action: "Kept in the browser's caches, with a size limit." }
  - id: dflow:stores-refresh
    name: Stores that refresh themselves
    final: [M2-schedule, M2-serve, M2-stores, M2-ages]
    detail: { what: "A scheduled job reads the bulk sources, rebuilds our stores, proves them, and publishes them to R2. The app reads current.json and shows each set's age.", freshness: "Prices and records daily; the graph and EDHREC weekly", owner: "Ours, from others' data" }
    steps:
      - { piece: net:actions, action: "On schedule, tools/refresh.mjs runs." }
      - { piece: src:scryfall-bulk, action: "Reads every card and its prices." }
      - { piece: src:edhrec, action: "Weekly: ranks and co-play, gently." }
      - { piece: src:mtgjson, action: "Weekly: precon decklists." }
      - { piece: net:actions, action: "Rebuilds the stores and runs their proof. A failing run publishes nothing." }
      - { piece: r2:data/dated, action: "Uploads the files under today's date." }
      - { piece: r2:data/current.json, action: "Then rewrites current.json to name them. The last seven runs are kept." }
      - { piece: "route:GET:/data/*", action: "The Worker serves them, current.json on a short cache." }
      - { piece: rec:cache.files, action: "The service worker keeps the last good copy for offline use." }
  - id: dflow:stores-pinned
    name: Stores pinned by hand
    current: { file: crankmagic-sw.js, match: 'data/graph\.json\?v=' }
    detail: { what: "Today's path: someone runs the refresh on a machine, bumps the ?v= pins, commits, and a release ships the files.", freshness: "As old as the last release", owner: "Ours" }
    steps:
      - { piece: net:laptop, action: "tools/refresh.mjs is run by hand." }
      - { piece: src:scryfall-bulk, action: "Reads the bulk files." }
      - { piece: rec:store.pinned, action: "Changed files get new ?v= pins and are committed." }
      - { piece: net:assets, action: "A release ships them as static files." }
      - { piece: rec:cache.files, action: "The service worker precaches them by pin." }
  - id: dflow:engine-cards
    name: The engine's cards
    final: [M4-engine, M5-definitions, M7-compiler, M2-pin]
    current: { file: tools/build-engine-cards.mjs, match: 'oracle' }
    detail: { what: "The rules text becomes a dated snapshot; each card gets a definition, hand-authored or compiled and checked; a game room loads the version it pinned.", freshness: "Daily snapshot; definitions when recompiled", owner: "Ours; the text is Wizards'" }
    steps:
      - { piece: src:scryfall-bulk, action: "The oracle text of every Commander-legal card." }
      - { piece: rec:store.oracle, action: "A dated snapshot of 31,830 cards." }
      - { piece: rec:engine.support, action: "The ledger says which cards the engine can play." }
      - { piece: rec:store.definitions, action: "Definitions: the seven decks by hand (M4), then every card compiled and checked (M7)." }
      - { piece: r2:engine/definitions, action: "Published, versioned." }
      - { piece: do:game-room, action: "A room loads the version its game pinned." }
  - id: dflow:game
    name: A game, played in the cloud
    final: [M5-room, M5-transport, M5-hidden, M5-results, M4-engine]
    detail: { what: "Each action goes to the table's room, which applies it through CME, writes it down, and sends every seat only what it may see. The result files itself into the library.", freshness: "Live, ordered, no polling", owner: "The players; hidden information never leaves the room" }
    steps:
      - { piece: net:browser, action: "A player acts: casts a spell, chooses a target." }
      - { piece: "route:GET:/api/tables/:id/socket", action: "Over the table's WebSocket." }
      - { piece: do:game-room, action: "The room applies it through CME; every choice is offered to its owner." }
      - { piece: rec:room.journal, action: "Written to the journal with a hash." }
      - { piece: rec:room.checkpoint, action: "Checkpointed through the storage adapter." }
      - { piece: rec:room.seats, action: "Each seat gets its own view; no seat sees another's hand." }
      - { piece: rec:library.games, action: "At the end, the game's record is filed under the deck and syncs." }
  - id: dflow:local-game
    name: A game on the local host
    current: { file: game/server/local-table-runtime.mjs, match: 'Forge' }
    detail: { what: "Today's path for Play: the frozen Windows host runs Forge, and remote guests arrive through a tunnel.", freshness: "Live while Rob's machine is on", owner: "Rob's machine" }
    steps:
      - { piece: net:browser, action: "A player opens the local table." }
      - { piece: net:tunnel, action: "A remote guest comes through a trycloudflare address." }
      - { piece: net:local-host, action: "The host keeps the table." }
      - { piece: net:forge, action: "Forge runs the rules." }
  - id: dflow:ai-call
    name: An AI call, through the door
    final: [M6-door, M6-privacy]
    detail: { what: "Only an allowlisted person, signed in with MFA, under a spend cap, with every call logged.", freshness: "Live", owner: "The person; the key is Rob's" }
    steps:
      - { piece: net:browser, action: "The Coach is asked, or an LLM seat takes its turn." }
      - { piece: net:access-ai, action: "The AI door's own sign-in: Google with MFA." }
      - { piece: "route:POST:/api/ai/call", action: "The Worker receives the call." }
      - { piece: d1:ai_allowlist, action: "Checks the person is allowed and under their cap." }
      - { piece: secret:anthropic-key, action: "Uses the key held as a Worker secret." }
      - { piece: src:anthropic, action: "Calls the model." }
      - { piece: d1:ai_calls, action: "Logs who, what for, tokens and cost." }
  - id: dflow:rules
    name: Rules adjudication
    final: [M2-adjudication, M4-legality]
    current: { file: game/engine/index.mjs, match: 'CR|Comprehensive' }
    detail: { what: "Where the engine meets an unclear case, the sources are read in order and the ruling is logged with the test that holds it.", freshness: "A newer CR date re-checks every citation", owner: "Ours; the texts are Wizards'" }
    steps:
      - { piece: src:wizards, action: "The Comprehensive Rules, then the card's rulings, then the release notes, then the Commander page." }
      - { piece: rec:wizards.cr, action: "Rules are cited by number against a stated date." }
      - { piece: net:actions, action: "A scheduled check lists the rules that moved." }
      - { piece: rec:wizards.legality, action: "A dated banned list checks decks at prepare." }
  - id: dflow:archidekt
    name: A deck from Archidekt
    final: [M1-archidekt]
    detail: { what: "A deck link is read once through the Worker; the person's library holds the result.", freshness: "Live, once", owner: "The person" }
    steps:
      - { piece: net:browser, action: "A deck link is pasted." }
      - { piece: "route:POST:/api/import/archidekt", action: "The Worker fetches it with a size limit." }
      - { piece: src:archidekt, action: "Archidekt returns the list." }
      - { piece: rec:library.decks, action: "It becomes a deck in the library." }
  - id: dflow:backup
    name: The nightly database copy
    final: [M3-backups]
    detail: { what: "D1 is exported to R2 each night, beside D1's own Time Travel.", freshness: "Nightly", owner: "Ours; person-level" }
    steps:
      - { piece: net:d1, action: "The database." }
      - { piece: r2:backups/d1, action: "Exported each night." }
      - { piece: rec:store.d1-backup, action: "Kept as a dated copy." }
  - id: dflow:release
    name: A release
    final: [S1-release]
    current: { file: tools/release-pages.mjs, match: 'RELEASE_BRANCH' }
    detail: { what: "One commit of main becomes a walked build, deployed to staging and then, on Rob's go, to production.", freshness: "Per release", owner: "Ours" }
    steps:
      - { piece: net:github, action: "A commit of main." }
      - { piece: net:actions, action: "The gate runs." }
      - { piece: net:cloud-session, action: "tools/release-pages.mjs builds it and the acceptance walk passes on it." }
      - { piece: secret:cloudflare-api-token, action: "wrangler deploys with the deploy credential." }
      - { piece: net:assets, action: "Staging first, then production on Rob's go." }

# ─────────────────────────────── User journeys ───────────────────────────────
journeys:
  - id: journey:visitor
    name: A signed-out visitor
    person: Visitor
    final: [M1-landing, M1-design]
    current: { file: index.html, match: 'crankmagic-app\.js' }
    steps:
      - { text: "Arrives at crankmagic.com and sees the landing page.", touches: [net:assets], final: [M1-landing] }
      - { text: "Starts a deck by pasting a list or naming a commander.", touches: [net:browser], flows: [dflow:card-live], final: [M1-landing], current: { file: deck-import.js, match: 'parse' } }
      - { text: "Browses Library and Explore; pictures load from Scryfall.", touches: [net:browser, src:scryfall-cdn], flows: [dflow:images, dflow:stores-refresh], final: [M1-design], current: { file: index.html, match: 'cards\.scryfall\.io' } }
      - { text: "Everything is kept in this browser. Signing in is optional.", touches: [net:indexeddb], flows: [], final: [S2-sync], current: { file: collection-repository.js, match: 'crankmagic-library' } }
  - id: journey:builder
    name: A builder on two devices
    person: Builder
    final: [S2-sync]
    current: { file: crankmagic-account.js, match: 'api/library' }
    steps:
      - { text: "Signs in with Google through Access.", touches: [net:access, src:google], flows: [], final: [S2-access], current: { file: crankmagic-account.js, match: 'api/auth/login' } }
      - { text: "Edits a deck on the laptop; the library saves itself to the cloud.", touches: [net:worker, d1:snapshots], flows: [dflow:library-sync], final: [S2-sync], current: { file: crankmagic-account.js, match: 'api/library' } }
      - { text: "Opens the phone; the same library is there.", touches: [d1:heads], flows: [dflow:library-sync], final: [S2-sync], current: { file: crankmagic-account.js, match: 'api/me' } }
      - { text: "Both changed offline: asked which to keep, and the other is held 30 days.", touches: ["route:POST:/api/library/kept"], flows: [dflow:library-sync], final: [S2-sync], current: { file: crankmagic-account.js, match: 'api/library/kept' } }
      - { text: "Checks Settings › About for how old each data set is.", touches: [rec:store.current], flows: [dflow:stores-refresh], final: [M2-ages] }
  - id: journey:collector
    name: A collector at a shop
    person: Collector
    final: [M2-live-first, M2-offline]
    current: { file: scryfall-client.js, match: 'api\.scryfall\.com' }
    steps:
      - { text: "Opens a card on the phone and sees today's price and its age.", touches: [src:scryfall-api, rec:cache.card-records], flows: [dflow:card-live], final: [M2-live-first], current: { file: scryfall-client.js, match: 'prices' } }
      - { text: "Signal drops; the library and cached cards still work.", touches: [net:service-worker, rec:cache.files], flows: [dflow:card-live], final: [M2-offline], current: { file: crankmagic-sw.js, match: 'DATA_CACHE' } }
      - { text: "Adds it to To Buy; the deck's cost to finish updates from the price snapshot.", touches: [rec:library.lots, rec:store.cards], flows: [dflow:stores-refresh, dflow:library-sync], final: [M2-stores], current: { file: collection-model.js, match: 'toBuy' } }
  - id: journey:table
    name: A host and an invited guest
    person: Host
    final: [M5-front-door, M5-lobby, M5-transport]
    steps:
      - { text: "The host creates a table and picks a mat.", touches: ["route:POST:/api/tables", d1:tables, do:game-room], flows: [], final: [M5-front-door] }
      - { text: "Invites a guest by email, link or QR.", touches: [d1:seats], flows: [], final: [M5-lobby] }
      - { text: "The guest signs in and takes the seat.", touches: [net:access, "route:POST:/api/tables/:id/seats"], flows: [], final: [M5-front-door] }
      - { text: "Every human seat ready: a ten-second countdown, then the game starts.", touches: [do:game-room], flows: [dflow:game], final: [M5-lobby] }
      - { text: "They play over the table's WebSocket; a dropped phone reconnects to a fresh view.", touches: ["route:GET:/api/tables/:id/socket", rec:room.seats], flows: [dflow:game], final: [M5-reconnect] }
      - { text: "The result files itself under each player's deck.", touches: [rec:library.games], flows: [dflow:game, dflow:library-sync], final: [M5-results] }
      - { text: "Today: the host starts the Windows host with remote guests on, and the guest joins through a trycloudflare address.", touches: [net:local-host, net:tunnel], flows: [dflow:local-game], current: { file: game/server/guest-gateway.mjs, match: 'guest' } }
  - id: journey:ai-seat
    name: A player with an AI seat
    person: AI-seat player
    final: [M4-house-pilot, M6-door]
    steps:
      - { text: "Fills a seat with the house pilot, which costs nothing and sees only its seat.", touches: [do:game-room], flows: [dflow:game], final: [M4-house-pilot] }
      - { text: "Or, if allowlisted, an LLM seat through the AI door.", touches: [net:access-ai, d1:ai_allowlist], flows: [dflow:ai-call], final: [M6-door] }
      - { text: "A spend meter shows what the game has cost.", touches: [d1:ai_calls], flows: [dflow:ai-call], final: [M6-door] }
      - { text: "Asks the Coach what to do next.", touches: ["route:POST:/api/ai/call", src:anthropic], flows: [dflow:ai-call], final: [M10-finish] }
  - id: journey:operator
    name: Rob as the operator
    person: Rob
    final: [M3-invite, S1-release]
    current: { file: docs/handoff-2026-09-25.md, match: 'Invited' }
    steps:
      - { text: "Invites a person by adding their email to the Access Invited list.", touches: [net:cf-dashboard, net:access], flows: [], final: [M3-invite], current: { file: docs/handoff-2026-09-25.md, match: 'Invited' } }
      - { text: "Enters secrets himself: the data job's token in GitHub, the AI key as a Worker secret.", touches: [secret:r2-token, secret:anthropic-key], flows: [], final: [M2-schedule, M6-door] }
      - { text: "Approves a plan; a cloud session builds, walks and deploys it to staging.", touches: [net:cloud-session, net:worker], flows: [dflow:release], final: [S1-release], current: { file: docs/handoff-2026-09-25.md, match: 'Working from a cloud session' } }
      - { text: "Says go; production deploys.", touches: [net:assets], flows: [dflow:release], final: [S1-release], current: { file: AGENTS.md, match: 'release-acceptance' } }
      - { text: "Gets an alert on errors or sync conflicts.", touches: [net:analytics], flows: [], final: [M3-monitoring] }

# ─────────────────────────────── Plain words ───────────────────────────────
glossary:
  - { term: "Worker", means: "A small program Cloudflare runs close to the reader, for each request it is asked to answer." }
  - { term: "D1", means: "Cloudflare's SQL database. Only the Worker can reach it." }
  - { term: "R2", means: "Cloudflare's file storage, for whole files like a day's card data." }
  - { term: "Durable Object", means: "A single, named place in Cloudflare that keeps state and runs code for it; here, one per game." }
  - { term: "Access", means: "Cloudflare's sign-in gate. It lets through only invited people and tells the Worker who they are." }
  - { term: "token", means: "A signed note that proves who someone is for a short time." }
  - { term: "IndexedDB", means: "The browser's own database, on the reader's device." }
  - { term: "service worker", means: "A script the browser keeps beside a site so it can open and work offline." }
  - { term: "Cache Storage", means: "Where a service worker keeps copies of files." }
  - { term: "session storage", means: "Browser storage that lasts only as long as the tab." }
  - { term: "CDN", means: "A network that serves the same files from many places, close to each reader." }
  - { term: "bulk file", means: "One large download of a whole data set, instead of one request per record." }
  - { term: "current.json", means: "A small file naming the newest good copy of each data set." }
  - { term: "?v=", means: "A number added to a file's address so a browser fetches the new copy after a change." }
  - { term: "WebSocket", means: "A connection that stays open so updates arrive as they happen, without asking again." }
  - { term: "CME", means: "The CrankMagic Engine: our own implementation of the game's rules." }
  - { term: "journal", means: "The ordered list of every action in a game; replaying it gives the same game." }
  - { term: "checkpoint", means: "A saved copy of a game's state so it can resume after a restart." }
  - { term: "storage adapter", means: "The one interface the engine saves through, so the same engine runs in a test or a game room." }
  - { term: "house pilot", means: "The engine's own opponent. It sees only its seat and costs nothing to run." }
  - { term: "hidden information", means: "What a player may not see: another player's hand, the order of a library." }
  - { term: "security policy", means: "The list of places a page may load from or talk to. The browser enforces it." }
  - { term: "CORS", means: "The browser's rule for when a page may read another site's answer." }
  - { term: "OIDC", means: "The standard way one service asks another, such as Google, who a person is." }
  - { term: "MFA", means: "Signing in with a second proof, such as a passkey." }
  - { term: "allowlist", means: "The list of people allowed to use something." }
  - { term: "binding", means: "A direct connection Cloudflare sets up between a Worker and a database or bucket, with no address to attack." }
  - { term: "stale-while-revalidate", means: "Show the saved copy now and quietly fetch a fresh one." }
  - { term: "snapshot", means: "A saved copy of something as it was at one moment." }
  - { term: "head", means: "The version every device should end up with." }
  - { term: "Comprehensive Rules", means: "Wizards' complete rules of the game, numbered." }
  - { term: "oracle text", means: "A card's official, current rules text." }
  - { term: "wrangler", means: "Cloudflare's command-line tool for deploying Workers." }
  - { term: "GitHub Actions", means: "GitHub's machines that run jobs on a push or a schedule." }
  - { term: "engram", means: "Rob's tool that maps a codebase into a graph. This page is drawn from it." }
