    place: { schema: { group: outside, order: 8 } }
    detail: { what: "The game's rules, revised with most sets. The engine cites rules by number.", live: "Read at build time and when adjudicating; never by a reader's browser", lifetime: "A git-ignored cache in the job", refresh: "A scheduled check for a newer text date", terms: "Wizards' text: read and cited, not committed or redistributed", source: "media.wizards.com" }
    fields:
      - { name: rule, type: text, core: true, required: true, meaning: "The rule's number.", example: "903.4", source: "Wizards", match: 'CR' }
      - { name: text, type: text, core: true, required: true, current: false, meaning: "Its words, never committed.", example: "…", source: "Wizards", final: [M2-adjudication] }
      - { name: date, type: date, core: true, required: true, current: false, meaning: "The text's effective date.", example: "2026-09-26", source: "Wizards", final: [M2-adjudication] }
  - id: rec:wizards.legality
