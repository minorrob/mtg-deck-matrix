  # The reader's cache
  - id: rec:cache.card-records
    kind: RecordType
    name: card records (IndexedDB)
    origin: scryfall
    final: [M2-live-first, M2-offline]
    hosted: net:indexeddb
    place: { schema: { group: cache, order: 1 } }
    detail: { what: "Each card record fetched from Scryfall, kept in the browser with its fetch time.", live: "Live first; this is the second choice", lifetime: "7 days for a record, 24 hours for its price, and at once when a set releases", source: "Scryfall", terms: "Scryfall's content, cached for the reader only", plan: "M2" }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "Scryfall's id.", example: "5f8287b1-…", source: "Scryfall", joins: { to: rec:scryfall.card.id, cardinality: "one to one" } }
      - { name: record, type: object, core: true, required: true, meaning: "The card as Scryfall returned it.", example: "{…}", source: "Scryfall" }
      - { name: fetchedAt, type: date, core: true, required: true, meaning: "When it was read.", example: "2026-10-01T09:00:00Z", source: "The browser" }
      - { name: etag, type: text, core: true, required: false, meaning: "Lets the browser ask 'has it changed?' instead of downloading again.", example: "W/\"a1b2\"", source: "Scryfall" }
  - id: rec:cache.session-scryfall
    kind: RecordType
    name: card lookups (session storage)
    origin: scryfall
    current: { file: crankmagic-card-client.js, match: 'sessionStorage' }
    hosted: net:browser
    place: { schema: { group: cache, order: 2 } }
    detail: { what: "Today's cache of Scryfall lookups: kept in the tab's session storage for 24 hours, and gone when the tab closes.", final: "Replaced by the IndexedDB card records, which survive a restart and work offline.", source: "Scryfall", lifetime: "24 hours, this tab only", plan: "M2" }
    fields:
      - { name: key, type: text, core: true, required: true, meaning: "The lookup, such as a name.", example: "named:sol ring", source: "The app", match: 'prefix' }
      - { name: payload, type: object, core: true, required: true, meaning: "What Scryfall returned.", example: "{…}", source: "Scryfall" }
      - { name: savedAt, type: number, core: true, required: true, meaning: "When it was saved.", example: "1727250000000", source: "The browser", match: 'savedAt|CACHE_TTL' }
  - id: rec:cache.files
    kind: RecordType
    name: app and data files (Cache Storage)
    final: [M2-offline]
    current: { file: crankmagic-sw.js, match: 'DATA_CACHE' }
    hosted: net:service-worker
    place: { schema: { group: cache, order: 3 } }
    detail: { what: "The service worker's copies of the app and the data sets, so the app opens offline.", today: "Keyed by ?v= pins", final: "Keyed by the dated files current.json names; the last good copy stays", plan: "M2" }
    fields:
      - { name: url, type: text, core: true, required: true, meaning: "The file's address.", example: "data/2026-10-12/cards.json", source: "The app", match: 'request' }
      - { name: cache, type: text, core: true, required: true, meaning: "shell or data.", example: "data", source: "The worker", match: 'SHELL_CACHE' }
      - { name: version, type: text, core: true, required: true, meaning: "Which build or data run it belongs to.", example: "2026-10-12", source: "current.json", match: 'keyFor' }

  # Stored by us, refreshed
  - id: rec:store.current
    kind: RecordType
    name: current.json
    final: [M2-serve, M2-ages, M2-pin]
    hosted: net:r2
    place: { schema: { group: stores, order: 1 } }
    detail: { what: "The index of the newest good data run. The app, the Settings page and a game room all read it.", lifetime: "Short cache", refresh: "Rewritten last by each good run", plan: "M2" }
    fields:
      - { name: date, type: date, core: true, required: true, meaning: "The run's date; a game pins it.", example: "2026-10-12", source: "The scheduled job" }
      - { name: "files[].name", type: text, core: true, required: true, meaning: "A data set's name.", example: "cards", source: "The job" }
      - { name: "files[].key", type: text, core: true, required: true, meaning: "Its dated key in R2.", example: "data/2026-10-12/cards.json", source: "The job" }
      - { name: "files[].sha256", type: text, core: true, required: true, meaning: "Its checksum.", example: "e3b0…", source: "The job" }
      - { name: "files[].madeAt", type: date, core: true, required: true, meaning: "When that set was last refreshed; Settings › About shows it.", example: "2026-10-12T04:10:00Z", source: "The job" }
  - id: rec:store.pinned
    kind: RecordType
    name: ?v= pinned data files
    current: { file: crankmagic-sw.js, match: 'data/graph\.json\?v=' }
    hosted: net:assets
    place: { schema: { group: stores, order: 2 } }
    detail: { what: "Today the data files ship inside each release, each named with a ?v= number the code carries. A refresh is a code change.", final: "Replaced by current.json and dated files in R2.", plan: "M2" }
    fields:
      - { name: file, type: text, core: true, required: true, meaning: "The data file.", example: "data/cards.json", source: "The release", match: 'data/' }
      - { name: v, type: integer, core: true, required: true, meaning: "The pin a browser needs to fetch the new copy.", example: "21", source: "tools/bump-pins.mjs", match: '\?v=' }
      - { name: sha, type: text, core: true, required: true, meaning: "The checksum tests/asset-versions.mjs records.", example: "9c1d…", source: "The manifest", match: 'keyFor' }
  - id: rec:store.cards
    kind: RecordType
    name: card records and prices
    origin: scryfall
    final: [M2-stores, M2-schedule]
    current: { file: crankmagic-assets.js, match: 'cards\.json' }
    hosted: net:r2
    place: { schema: { group: stores, order: 3 } }
    detail: { what: "One dated snapshot of the card records the app carries, with prices, for bulk arithmetic: a deck's cost to finish, the buy list's total, the cap checks.", today: "data/cards.json, a pinned static file refreshed by hand", source: "Scryfall's default_cards bulk file", refresh: "Daily", terms: "Scryfall's data; bulk file, descriptive User-Agent", plan: "M2" }
    fields:
      - { name: id, type: text, core: true, required: true, meaning: "Scryfall's id.", example: "5f8287b1-…", source: "Scryfall", joins: { to: rec:scryfall.card.id, cardinality: "one to one" } }
      - { name: name, type: text, core: true, required: true, meaning: "The card's name.", example: "Sol Ring", source: "Scryfall" }
      - { name: typeLine, type: text, core: true, required: true, meaning: "Its type line.", example: "Artifact", source: "Scryfall" }
      - { name: prices.usd, type: number, core: true, required: false, match: 'usd', meaning: "The US price (TCGplayer).", example: "1.49", source: "Scryfall prices" }
  - id: rec:store.name-index
    kind: RecordType
    name: name index
    origin: scryfall
    final: [M2-stores]
    current: { file: crankmagic-assets.js, match: 'commander-universe' }
    hosted: net:r2
    place: { schema: { group: stores, order: 4 } }
    detail: { what: "Every Commander-legal card's name and identity, so search and pickers work without 31,830 requests.", today: "data/commander-universe.json", source: "Scryfall's oracle_cards bulk file", refresh: "Daily", plan: "M2" }
    fields:
      - { name: name, type: text, core: true, required: true, meaning: "The card's name.", example: "Sol Ring", source: "Scryfall" }
      - { name: oracleId, type: text, core: true, required: true, meaning: "The card across printings.", example: "6ad8011d-…", source: "Scryfall", joins: { to: rec:scryfall.card.oracle_id, cardinality: "one to one" } }
      - { name: colorIdentity, type: text, core: true, required: true, meaning: "Its colors for Commander.", example: "C", source: "Scryfall" }
  - id: rec:store.oracle
    kind: RecordType
    name: engine oracle snapshot
    origin: scryfall
    final: [M2-stores, M2-pin, M4-engine]
    current: { file: tools/build-engine-cards.mjs, match: 'oracle' }
    hosted: net:r2
    place: { schema: { group: stores, order: 5 } }
    detail: { what: "The rules text of all 31,830 cards the engine knows, as of a stated date, so a game is deterministic and replays identically.", today: "data/engine/oracle.json, committed", source: "Scryfall's oracle_cards (Wizards' Oracle text)", refresh: "Daily, pinned by date", plan: "M2 and M5" }
    fields:
      - { name: oracleId, type: text, core: true, required: true, meaning: "The card.", example: "6ad8011d-…", source: "Scryfall", joins: { to: rec:scryfall.card.oracle_id, cardinality: "one to one" } }
      - { name: name, type: text, core: true, required: true, meaning: "Its name.", example: "Sol Ring", source: "Scryfall" }
      - { name: oracleText, type: text, core: true, required: true, meaning: "Its rules text.", example: "{T}: Add {C}{C}.", source: "Wizards, through Scryfall", match: 'oracle' }
      - { name: date, type: date, core: true, required: true, meaning: "The snapshot's date.", example: "2026-10-12", source: "The job", match: 'generatedAt' }
  - id: rec:store.definitions
    kind: RecordType
    name: card definitions
    final: [M7-compiler, M5-definitions]
    hosted: net:r2
    place: { schema: { group: stores, order: 6 } }
    detail: { what: "The engine's definition of each card, hand-authored for the seven decks and compiled for the rest, each checked against its oracle text.", plan: "M4 (the seven decks), M7 (every card)" }
    fields:
      - { name: oracleId, type: text, core: true, required: true, meaning: "The card.", example: "6ad8011d-…", source: "The oracle snapshot", joins: { to: rec:store.oracle.oracleId, cardinality: "one to one" } }
      - { name: version, type: text, core: true, required: true, meaning: "The definition's version; a game pins it.", example: "2026-10-12.3", source: "The compiler" }
      - { name: script, type: object, core: true, required: true, meaning: "The card's behavior in the engine's vocabulary.", example: "{…}", source: "Hand-authored or compiled" }
      - { name: status, type: text, core: true, required: true, meaning: "supported, or refused with what it lacks.", example: "supported", source: "The support ledger", joins: { to: rec:engine.support.status, cardinality: "one to one" } }
  - id: rec:engine.support
    kind: RecordType
    name: support ledger
    final: [M7-compiler, M4-engine]
    current: { file: tools/build-engine-cards.mjs, match: 'support' }
    hosted: net:r2
    place: { schema: { group: stores, order: 7 } }
    detail: { what: "For every card in the pool, whether the engine can play it yet and, if not, the construct it lacks.", today: "data/engine/support.json; every row unsupported until definitions land", plan: "M4 and M7" }
    fields:
      - { name: oracleId, type: text, core: true, required: true, meaning: "The card.", example: "6ad8011d-…", source: "The pool", joins: { to: rec:store.oracle.oracleId, cardinality: "one to one" } }
      - { name: tier, type: integer, core: true, required: true, meaning: "How much new engine work the card needs.", example: "0", source: "The inventory", match: 'tier' }
      - { name: status, type: text, core: true, required: true, meaning: "supported or unsupported.", example: "unsupported", source: "The ledger", match: 'status|legend' }
  - id: rec:store.graph
    kind: RecordType
    name: relationship graph
    final: [M2-stores]
    current: { file: crankmagic-assets.js, match: 'graph\.json' }
    hosted: net:r2
    place: { schema: { group: stores, order: 8 } }
    detail: { what: "Our own derived data: how every card relates to every other, behind Explore. Computed across every card, so it must be stored.", today: "data/graph.json (16 MB) and data/graph-played.json (21 MB), near Cloudflare's 25 MiB file cap", refresh: "Weekly, when its inputs change", plan: "M2 splits graph-played before it reaches the cap" }
    fields:
      - { name: card, type: text, core: true, required: true, meaning: "A card.", example: "Sol Ring", source: "The name index", match: 'cards', joins: { to: rec:store.name-index.name, cardinality: "one to one" } }
