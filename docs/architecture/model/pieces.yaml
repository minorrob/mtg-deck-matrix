    place: { schema: { group: outside, order: 5 } }
    detail: { what: "How popular each commander is.", live: "Stored: EDHREC has no public API", lifetime: "The worker's data cache", refresh: "Weekly, gently", terms: "Unofficial JSON pages; read gently on a schedule and cached", source: "EDHREC" }
    fields:
      - { name: name, type: text, core: true, required: true, meaning: "The commander.", example: "Kykar, Wind's Fury", source: "EDHREC", joins: { to: rec:store.name-index.name, cardinality: "one to one" } }
      - { name: rank, type: integer, core: true, required: true, meaning: "Its place.", example: "212", source: "EDHREC" }
