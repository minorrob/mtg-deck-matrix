    fields:
      - { name: oracle_id, type: text, core: true, required: true, meaning: "The card.", example: "6ad8011d-…", source: "Scryfall", joins: { to: rec:scryfall.card.oracle_id, cardinality: "many to one" } }
      - { name: published_at, type: date, core: true, required: true, meaning: "When the ruling was published.", example: "2021-03-19", source: "Wizards" }
      - { name: comment, type: text, core: true, required: true, meaning: "The ruling.", example: "…", source: "Wizards" }
  - id: rec:edhrec.ranks
