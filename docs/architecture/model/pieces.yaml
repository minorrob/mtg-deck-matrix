  - id: rec:store.d1-backup
    kind: RecordType
    name: nightly database copy
    final: [M3-backups]
    hosted: net:r2
    place: { schema: { group: stores, order: 9 } }
    detail: { what: "A nightly export of D1, beside Time Travel.", owner: "Ours; person-level", plan: "M3" }
    fields:
      - { name: date, type: date, core: true, required: true, meaning: "The night it was taken.", example: "2026-10-12", source: "The job" }
      - { name: tables, type: list, core: true, required: true, meaning: "users, snapshots, heads and the rest.", example: "[users, snapshots, heads]", source: "D1", joins: { to: d1:users.id, cardinality: "copy of" } }

  # The game room (implemented in the engine today; hosted by no room yet)
  - id: rec:room.state
    kind: RecordType
    name: game state
    final: [M5-room, M4-engine, M2-pin]
    current: { file: game/engine/state/index.mjs, match: 'zones|seed' }
    hosted: net:game-rooms
    place: { schema: { group: room, order: 1 } }
    detail: { what: "The authoritative game: the seed, the turn, every zone and a hash of it all. Only the room holds it.", today: "CME builds it in its own tests; no room hosts it yet", plan: "M4 and M5" }
    fields:
      - { name: room_id, type: text, core: true, required: true, current: false, meaning: "The room this game lives in.", example: "do_91f…", source: "Cloudflare", final: [M5-room] }
      - { name: seed, type: text, core: true, required: true, meaning: "The random seed; the same seed and actions give the same game.", example: "0x5eed…", source: "The room", match: 'seed' }
      - { name: turn, type: integer, core: true, required: true, meaning: "Whose turn and which step.", example: "7", source: "The engine", match: 'turn' }
      - { name: zones, type: object, core: true, required: true, meaning: "Library, hand, battlefield, graveyard, exile, stack and command zone for each seat.", example: "{…}", source: "The engine", match: 'zones' }
      - { name: dataVersion, type: text, core: true, required: true, current: false, meaning: "The oracle snapshot and definitions pinned at start.", example: "2026-10-12", source: "current.json", final: [M2-pin], joins: { to: rec:store.current.date, cardinality: "many to one" } }
  - id: rec:room.journal
    kind: RecordType
    name: journal
    final: [M5-room, M4-engine, M8-playtest]
    current: { file: game/engine/journal.mjs, match: 'journal' }
    hosted: net:game-rooms
    place: { schema: { group: room, order: 2 } }
    detail: { what: "Every action in order, with a hash after each. A game replays identically from its seed and journal; a playtest exports both.", plan: "M4 (the CME history event contract), M8 (the download)" }
    fields:
      - { name: seq, type: integer, core: true, required: true, meaning: "The action's number.", example: "412", source: "The room", match: 'seq' }
      - { name: seat, type: integer, core: true, required: true, meaning: "Who acted.", example: "2", source: "The room", match: 'seat' }
      - { name: action, type: object, core: true, required: true, meaning: "What they did, with its targets.", example: "{cast: …}", source: "The player", match: 'action' }
      - { name: hash, type: text, core: true, required: true, meaning: "The state's hash after it.", example: "9a0f…", source: "The engine", match: 'hash' }
  - id: rec:room.checkpoint
    kind: RecordType
    name: checkpoint
    final: [M5-room, M4-engine, M5-reconnect]
    current: { file: game/engine/journal.mjs, match: 'checkpoint' }
    hosted: net:game-rooms
    place: { schema: { group: room, order: 3 } }
    detail: { what: "A saved copy of the state every so often, so a room resumes identically after a restart, written through the storage adapter.", plan: "M4 (4.1b, the storage adapter)" }
    fields:
      - { name: seq, type: integer, core: true, required: true, meaning: "The journal position it saves.", example: "400", source: "The room", match: 'seq', joins: { to: rec:room.journal.seq, cardinality: "one to one" } }
      - { name: state, type: object, core: true, required: true, meaning: "The whole state at that point.", example: "{…}", source: "The engine", match: 'state' }
      - { name: hash, type: text, core: true, required: true, meaning: "Its hash, checked on resume.", example: "71c2…", source: "The engine", match: 'hash' }
  - id: rec:room.seats
    kind: RecordType
    name: seats in play
    final: [M5-room, M5-hidden, M5-reconnect]
    current: { file: game/engine/projection.mjs, match: 'seat' }
    hosted: net:game-rooms
    place: { schema: { group: room, order: 4 } }
    detail: { what: "Each seat's connection and the view it may see. A seat's view never includes another seat's hand.", plan: "M5" }
    fields:
      - { name: seat, type: integer, core: true, required: true, meaning: "Seat 1 to 4.", example: "2", source: "The table", match: 'seat', joins: { to: d1:seats.seat, cardinality: "one to one" } }
      - { name: identity, type: text, core: true, required: true, current: false, meaning: "Who is in the seat, from Access; kept out of the engine.", example: "withheld", source: "The Worker", final: [M5-front-door] }
      - { name: kind, type: text, core: true, required: true, current: false, meaning: "human, house or llm.", example: "house", source: "The table", final: [M5-room] }
      - { name: connected, type: boolean, core: true, required: true, current: false, meaning: "Whether the seat is connected; a game pauses at a required decision rather than conceding.", example: "true", source: "The room", final: [M5-reconnect] }

