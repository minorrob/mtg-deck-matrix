<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-body);font:var(--text-body)/var(--leading-body) var(--font-body)}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;height:56px;border-radius:var(--radius-control);border:1px solid var(--border-default)}.sw b{color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><i style="background:var(--color-bg)"></i><b>Ground</b>--color-bg</div><div class="sw"><i style="background:var(--color-panel)"></i><b>Panel</b>--color-panel</div><div class="sw"><i style="background:var(--color-raised)"></i><b>Raised</b>--color-raised</div><div class="sw"><i style="background:var(--color-line)"></i><b>Line</b>--color-line</div><div class="sw"><i style="background:var(--color-ink)"></i><b>Ink</b>--color-ink</div><div class="sw"><i style="background:var(--color-muted)"></i><b>Muted</b>--color-muted</div></div></body></html>
