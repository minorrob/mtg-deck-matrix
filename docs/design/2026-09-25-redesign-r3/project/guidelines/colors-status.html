<!-- @dsCard group="Colors" viewport="700x150" subtitle="One hue per rung of where a card is" name="Status hues" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-body);font:var(--text-body)/var(--leading-body) var(--font-body)}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;height:56px;border-radius:var(--radius-control);border:1px solid var(--border-default)}.sw b{color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><i style="background:var(--st-inbox)"></i><b>In box</b>--st-inbox</div><div class="sw"><i style="background:var(--st-pull)"></i><b>Ready to add</b>--st-pull</div><div class="sw"><i style="background:var(--st-ordered)"></i><b>Ordered</b>--st-ordered</div><div class="sw"><i style="background:var(--st-buy)"></i><b>To buy</b>--st-buy</div><div class="sw"><i style="background:var(--st-standin)"></i><b>Substitute</b>--st-standin</div><div class="sw"><i style="background:var(--st-remove)"></i><b>Remove</b>--st-remove</div></div></body></html>
