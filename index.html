<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1411">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Decks">
  <meta name="description" content="Six Commander decks: what each one does, how to play it, every card in it, what is on the bench, and what is still to buy.">
  <meta property="og:title" content="My Commander Decks">
  <meta property="og:description" content="Six decks, ranked. How to play them, the cards in them, the bench, and the buy list.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Commander Decks">
  <meta name="twitter:description" content="Six decks, ranked. How to play them, the cards in them, the bench, and the buy list.">
  <meta name="twitter:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <title>My Commander Decks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="viewer.css?v=8">
  <!-- Adding a deck. Six small modules rather than one, because each is useful
       and testable on its own: the parser has no idea what a score is, and the
       simulator has no idea where a decklist came from. Loaded here in
       dependency order; every one of them is a UMD module that also runs under
       Node, which is how tests/ reaches them. -->
  <script src="lineup-model.js?v=1" defer></script>
  <script src="sim-engine.js?v=1" defer></script>
  <script src="scryfall-client.js?v=1" defer></script>
  <script src="deck-import.js?v=1" defer></script>
  <script src="deck-sources.js?v=1" defer></script>
  <script src="deck-measure.js?v=1" defer></script>
  <script src="deck-store.js?v=1" defer></script>
  <script src="import-panel.js?v=1" defer></script>
  <script src="viewer.js?v=10" defer></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="topbar-row">
      <div class="brand">
        <h1>My Decks</h1>
        <span class="brand-sub" id="brand-sub">six Commander decks, what they do, and what they still need</span>
      </div>
      <nav class="tabs" aria-label="Sections">
        <button class="tab" type="button" data-view="decks" aria-selected="true">Decks</button>
        <button class="tab" type="button" data-view="bench" id="tab-bench" aria-selected="false">
          Bench <span class="count">0</span>
        </button>
        <button class="tab" type="button" data-view="buy" id="tab-buy" aria-selected="false">
          To Buy <span class="count">0</span>
        </button>
      </nav>
    </div>
    <div id="ribbon-slot"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="page"></div>

    <footer class="foot">
      <span>Built from the Deck Master workbook.</span>
      <a href="matrix.html">Full deck matrix &amp; shopping tools →</a>
      <a href="graph.html">Card graph →</a>
    </footer>
  </div>
</main>

<div class="tray" id="tray" role="region" aria-label="Selected cards">
  <div class="wrap">
    <div class="tray-in">
      <span class="tally" id="tray-tally">0 selected</span>
      <input class="to" id="share-to" type="email" inputmode="email" autocomplete="email"
             placeholder="Email it to… (remembered on this device)">
      <button class="btn primary" id="share-btn" type="button">Share</button>
      <button class="btn" id="copy-btn" type="button">Copy list</button>
      <button class="btn ghost" id="clear-btn" type="button">Clear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
