<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#112b24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trey's Deck Matrix">
  <meta name="description" content="Compare Commander deck variants, choose upgrades, and carry a focused card-shopping checklist.">
  <meta property="og:title" content="Trey's Deck Matrix">
  <meta property="og:description" content="Compare decks, choose buys, and shop from one mobile-friendly list.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Trey's Deck Matrix">
  <meta name="twitter:description" content="Compare decks, choose buys, and shop from one mobile-friendly list.">
  <meta name="twitter:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <title>Trey's MtG Deck Builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css?v=58">
  <script src="lineup-model.js?v=3" defer></script>
  <script src="compliance-model.js?v=1" defer></script>
  <script src="scryfall-client.js?v=2" defer></script>
  <script src="custom-model.js?v=2" defer></script>
  <script src="deck-generator.js?v=2" defer></script>
  <script src="slot-model.js?v=9" defer></script>
  <script src="deck-page.js?v=24" defer></script>
  <script src="shop-page.js?v=10" defer></script>
  <script src="app.js?v=81" defer></script>
  <script src="shop-filters.js?v=5" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="banner-art" aria-hidden="true">
      <img src="https://api.scryfall.com/cards/named?format=image&amp;version=art_crop&amp;fuzzy=Betor%2C+Ancestor%27s+Voice" alt="">
      <img src="https://api.scryfall.com/cards/named?format=image&amp;version=art_crop&amp;fuzzy=Slinza%2C+the+Spiked+Stampede" alt="">
      <img src="https://api.scryfall.com/cards/named?format=image&amp;version=art_crop&amp;fuzzy=Sauron%2C+the+Dark+Lord" alt="">
    </div>
    <div class="brand-row" id="header-brand">
      <div>
        <p class="eyebrow">Commander field guide</p>
        <h1>Trey's Deck Matrix</h1>
      </div>
      <div class="header-actions">
        <button class="tour-button" id="tour-button" type="button">▶ Tour</button>
        <button class="state-io-button" id="export-state-button" type="button" title="Download every selection, buy, Shop List mark, and Live Decks change on this device as one file">⬇ Export</button>
        <label class="state-io-button state-io-file" title="Load a previously exported state file, replacing everything currently saved on this device">⬆ Import<input type="file" accept=".json,application/json" id="import-state-input" hidden></label>
        <button class="state-io-button" id="load-active-button" type="button" title="Load data/active-state.json from this repository, replacing everything currently saved on this device">↺ Load Active</button>
        <button class="state-io-button" id="undo-load-button" type="button" hidden title="Put back whatever was on this device before the last file load">↺ Undo load</button>
        <button class="state-io-button" id="reset-button" type="button" title="Reset every deck pick, comment, optional buy, filter, and Bought checkmark on this device">⟲ Reset All</button>
        <span class="export-age" id="export-age" title="When you last downloaded a copy of everything on this device">never exported</span>
        <span class="save-status visually-hidden" id="save-status" aria-live="polite">Saved on this device</span>
      </div>
    </div>
    <nav class="main-tabs" aria-label="Deck shopping flow">
      <button class="main-tab is-active" data-view="compare" aria-selected="true">
        <span class="tab-step">1</span><span>Compare</span>
      </button>
      <button class="main-tab" data-view="deck2" aria-selected="false">
        <span class="tab-step">2</span><span>Deck</span>
      </button>
      <button class="main-tab" data-view="shop2" aria-selected="false">
        <span class="tab-step">3</span><span>Shop</span>
      </button>
      <button class="main-tab" data-view="log" aria-selected="false">
        <span class="tab-step">4</span><span>Game Log</span>
      </button>
    </nav>
    <button class="header-toggle" id="header-toggle" type="button" aria-expanded="false" aria-controls="header-brand"
      aria-label="Show the title and the Tour, Export, Import, Load Active and Reset buttons">
      <span aria-hidden="true">⌄</span>
    </button>
  </header>

  <main id="app" tabindex="-1">
    <!-- Step 0 - Choose is hidden for now. The view, its renderer and the whole
         generator stay in place; only the tab and this section are withdrawn, so
         turning it back on is putting these two elements back. -->
    <section class="view is-active" id="view-compare" aria-labelledby="compare-title">
      <div class="loading-card">Loading the deck catalog…</div>
    </section>
    <section class="view" id="view-buy" aria-labelledby="buy-title"></section>
    <section class="view" id="view-shop" aria-labelledby="shop-title"></section>
    <section class="view" id="view-live" aria-labelledby="live-title"></section>
    <section class="view" id="view-deck2" aria-labelledby="deck2-title"></section>
    <section class="view" id="view-shop2" aria-labelledby="shop2-title"></section>
    <section class="view" id="view-cards" aria-labelledby="cards-title"></section>
    <section class="view" id="view-log" aria-labelledby="log-title"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="info-tooltip-popover" id="info-tooltip" role="tooltip" hidden></div>
  <div class="tour-layer" id="tour-layer" hidden>
    <div class="tour-spotlight" id="tour-spotlight" aria-hidden="true"></div>
    <section class="tour-popover" id="tour-popover" role="dialog" aria-modal="true" aria-labelledby="tour-title">
      <button class="tour-close" id="tour-close" aria-label="Close tour">×</button>
      <p id="tour-progress"></p>
      <h2 id="tour-title"></h2>
      <div id="tour-copy"></div>
      <div class="tour-controls"><button id="tour-back" type="button">Back</button><button id="tour-next" type="button">Next</button></div>
    </section>
  </div>
  <dialog class="card-preview" id="card-preview">
    <button class="card-preview-close" id="card-preview-close" aria-label="Close card image">×</button>
    <img id="card-preview-image" alt="">
    <h2 id="card-preview-title"></h2>
    <p id="card-preview-meta"></p>
  </dialog>
  <dialog class="detail-sheet" id="detail-sheet">
    <button class="detail-sheet-close" id="detail-sheet-close" aria-label="Close detail panel">×</button>
    <div class="detail-sheet-layout">
      <aside class="detail-sheet-aside">
        <img id="detail-sheet-image" alt="">
        <p id="detail-sheet-kicker"></p>
        <h2 id="detail-sheet-title"></h2>
        <div id="detail-sheet-context"></div>
      </aside>
      <div class="detail-sheet-body" id="detail-sheet-body"></div>
    </div>
  </dialog>
  <dialog class="sim-dialog" id="sim-dialog">
    <button class="detail-sheet-close" id="sim-dialog-close" aria-label="Close the simulation panel">×</button>
    <div class="sim-dialog-head">
      <p id="sim-dialog-kicker"></p>
      <h2 id="sim-dialog-title"></h2>
    </div>
    <div class="sim-dialog-body" id="sim-dialog-body"></div>
  </dialog>
  <dialog class="compliance-dialog" id="compliance-dialog">
    <button class="detail-sheet-close" id="compliance-dialog-close" aria-label="Close compliance details">×</button>
    <div class="compliance-dialog-head">
      <p id="compliance-dialog-kicker"></p>
      <h2 id="compliance-dialog-title"></h2>
    </div>
    <div class="compliance-dialog-body" id="compliance-dialog-body"></div>
  </dialog>
  <footer>
    <span>Private to this browser · no account needed</span>
  </footer>
</body>
</html>
