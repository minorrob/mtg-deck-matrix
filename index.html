<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f3a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Decks">
  <meta name="description" content="Six Commander decks: what each one does, how to play it, every card in it, what is on the bench, and what is still to buy.">
  <meta property="og:title" content="My Commander Decks">
  <meta property="og:description" content="Six decks, ranked. How to play them, the cards in them, the bench, and the buy list.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Commander Decks">
  <meta name="twitter:description" content="Six decks, ranked. How to play them, the cards in them, the bench, and the buy list.">
  <meta name="twitter:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <title>My Commander Decks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter for the body, as the Matrix and the graph have it; Fraunces stays on
       the headings, which is the one thing this page keeps from its own theme.

       LOADED WITHOUT BLOCKING THE FIRST PAINT. A plain stylesheet link holds the
       render until it answers, and measured on a connection that could not reach
       fonts.googleapis.com that was 12.5 seconds of blank page -- for a font.
       media="print" makes it a non-blocking fetch; onload promotes it to the real
       stylesheet once it is here. Both stacks in viewer.css name real system
       fallbacks and the URL already carries display=swap, so the page is legible
       from the first paint and re-flows into Fraunces and Inter when they land. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="viewer.css?v=19">
  <!-- Adding a deck. Six small modules rather than one, because each is useful
       and testable on its own: the parser has no idea what a score is, and the
       simulator has no idea where a decklist came from. Loaded here in
       dependency order; every one of them is a UMD module that also runs under
       Node, which is how tests/ reaches them. -->
  <script src="lineup-model.js?v=5" defer></script>
  <script src="sim-engine.js?v=1" defer></script>
  <script src="scryfall-client.js?v=4" defer></script>
  <script src="deck-import.js?v=1" defer></script>
  <script src="deck-sources.js?v=1" defer></script>
  <script src="deck-measure.js?v=1" defer></script>
  <script src="deck-store.js?v=2" defer></script>
  <script src="import-panel.js?v=1" defer></script>
  <!-- Building one from nothing: the generator has been in this repo since the
       Choose tab existed and has been unreachable since that tab was retired.
       deck-build.js maps what it produces onto the same record an import makes. -->
  <script src="compliance-model.js?v=2" defer></script>
  <!-- What people play with your commander specifically, which is the question
       the generator's global popularity rank cannot answer. Optional: no page
       for a commander means the generator ranks the way it always did. -->
  <script src="edhrec-client.js?v=1" defer></script>
  <script src="deck-generator.js?v=6" defer></script>
  <script src="deck-build.js?v=2" defer></script>
  <script src="build-panel.js?v=4" defer></script>
  <!-- Reading what you own out of whatever file it lives in. xlsx-reader is a
       ZIP walk plus DecompressionStream, so a real Excel file is read here
       without asking anybody to export it as CSV first. -->
  <script src="xlsx-reader.js?v=1" defer></script>
  <script src="inventory-import.js?v=1" defer></script>
  <script src="viewer.js?v=17" defer></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="topbar-row">
      <div class="brand">
        <h1>My Decks</h1>
        <span class="brand-sub" id="brand-sub">six Commander decks, what they do, and what they still need</span>
      </div>
      <!-- The rest of the application. Compare, Deck, Shop, the Game Log and the
           Tour all live on matrix.html, and the only route to any of it was a
           footer link -- 1.0 screens below the fold on a desktop and 2.9 on a
           phone. A first-time visitor saw six decks and no sign the rest was
           there, including the one thing built to show them around. -->
      <nav class="elsewhere" aria-label="The rest of this app">
        <a href="matrix.html"><span class="long">Build &amp; shop</span><span class="short">Build</span></a>
        <a href="graph.html"><span class="long">Card graph</span><span class="short">Graph</span></a>
      </nav>
      <nav class="tabs" aria-label="Sections">
        <button class="tab" type="button" data-view="decks" aria-selected="true">Decks</button>
        <button class="tab" type="button" data-view="bench" id="tab-bench" aria-selected="false">
          Bench <span class="count">0</span>
        </button>
        <button class="tab" type="button" data-view="buy" id="tab-buy" aria-selected="false">
          To Buy <span class="count">0</span>
        </button>
      </nav>
    </div>
    <div id="ribbon-slot"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="page"></div>

    <footer class="foot">
      <span>Built from the Deck Master workbook.</span>
      <a href="matrix.html">Full deck matrix &amp; shopping tools →</a>
      <a href="graph.html">Card graph →</a>
    </footer>
  </div>
</main>

<div class="tray" id="tray" role="region" aria-label="Selected cards">
  <div class="wrap">
    <div class="tray-in">
      <span class="tally" id="tray-tally">0 selected</span>
      <input class="to" id="share-to" type="email" inputmode="email" autocomplete="email"
             aria-label="Email the list to"
             placeholder="Email it to… (remembered on this device)">
      <button class="btn primary" id="share-btn" type="button">Share</button>
      <button class="btn" id="copy-btn" type="button">Copy list</button>
      <button class="btn ghost" id="clear-btn" type="button">Clear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
