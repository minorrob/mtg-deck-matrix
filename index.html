<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#112b24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MtG Deck Matrix">
  <meta name="description" content="Compare Commander deck variants, choose upgrades, and carry a focused card-shopping checklist.">
  <meta property="og:title" content="MtG Deck Matrix">
  <meta property="og:description" content="Compare decks, choose buys, and shop from one mobile-friendly list.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MtG Deck Matrix">
  <meta name="twitter:description" content="Compare decks, choose buys, and shop from one mobile-friendly list.">
  <meta name="twitter:image" content="https://minorrob.github.io/mtg-deck-matrix/og.png">
  <title>MtG Deck Matrix</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand-row">
      <div>
        <p class="eyebrow">Commander field guide</p>
        <h1>Deck Matrix</h1>
      </div>
      <span class="save-status" id="save-status" aria-live="polite">Saved on this device</span>
    </div>
    <nav class="main-tabs" aria-label="Deck shopping flow">
      <button class="main-tab is-active" data-view="compare" aria-selected="true">
        <span class="tab-step">1</span><span>Compare</span>
      </button>
      <button class="main-tab" data-view="buy" aria-selected="false">
        <span class="tab-step">2</span><span>Buy Picks</span>
      </button>
      <button class="main-tab" data-view="shop" aria-selected="false">
        <span class="tab-step">3</span><span>Shop List</span>
      </button>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <section class="view is-active" id="view-compare" aria-labelledby="compare-title">
      <div class="loading-card">Loading the deck catalog…</div>
    </section>
    <section class="view" id="view-buy" aria-labelledby="buy-title"></section>
    <section class="view" id="view-shop" aria-labelledby="shop-title"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <footer>
    <button class="text-button" id="reset-button">Reset my picks</button>
    <span>Private to this browser · no account needed</span>
  </footer>
</body>
</html>
