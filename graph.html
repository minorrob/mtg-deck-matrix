<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f3a2b">
  <title>Card Graph &middot; My Decks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B8%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css?v=80">
  <link rel="stylesheet" href="graph-page.css?v=14">
  <!-- async, not defer. A deferred script BLOCKS every deferred script after it,
       so an unreachable CDN held the whole page -- card list, Copilot, filters --
       for as long as that one request took to fail. Measured at 12.7s on a
       connection that could not reach cdnjs. async lets graph-page.js run
       immediately; it already renders without the drawing library and says so,
       and re-draws by itself if the library turns up late. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"
          async onload="window.dispatchEvent(new Event('cytoscape-ready'))"></script>
  <!-- The Copilot's second source: findings computed from the measured deltas in
       data/deck-ratings.json, which the graph has no way to see. -->
  <script src="sim-lenses.js?v=1" defer></script>
  <!-- The one copy of "what does this card do", shared with graph/ingest/02-build-csv.mjs
       so a card looked up here is read by exactly the rules the corpus was baked with. -->
  <script src="card-classify.js?v=1" defer></script>
  <script src="scryfall-client.js?v=5" defer></script>
  <script src="graph-page.js?v=19" defer></script>
</head>
<body class="graph-body">
  <header class="app-header">
    <a class="back-link" href="index.html"><span class="back-arrow" aria-hidden="true">&#8592;</span> My Decks</a>
    <div class="brand-row">
      <div>
        <p class="eyebrow">Card graph</p>
        <h1>Every card, and what connects them</h1>
      </div>
      <div class="header-actions">
        <a class="state-io-button" href="matrix.html">Deck matrix &rarr;</a>
      </div>
    </div>
  </header>

  <main class="gp">
    <aside class="gp-pane" id="pane" aria-label="Filters">
      <div class="gp-pane-head">
        <strong>Filters</strong>
        <button class="gp-clear" id="clear" type="button">Clear all</button>
      </div>
      <!-- FOCUS, above the filters, because it is a different question.
           Everything below narrows the list; this picks the one card the graph is drawn
           around. It used to be reachable only by finding the card in the list and
           pressing Focus inside its popup, which works when the card is one of the 7,710
           and is a dead end when it is not. -->
      <div class="gp-focus">
        <label class="gp-focus-lab" for="focus-q">Focus card</label>
        <input type="search" id="focus-q" placeholder="Any Commander-legal card&hellip;"
               autocomplete="off" role="combobox" aria-expanded="false"
               aria-autocomplete="list" aria-controls="focus-menu"
               aria-describedby="focus-help">
        <p class="gp-focus-help" id="focus-help">Draws the graph around it. Cards outside the
          catalog are looked up and read by the same rules.</p>
        <!-- tabindex -1 on the list itself: it scrolls, and a browser puts any scrollable
             box in the tab order so a keyboard can reach the scrollbar. Here that meant Tab
             landed on the list rather than leaving the box, which is neither the combobox
             pattern nor what the arrow keys had just told a screen reader was happening. -->
        <div class="gp-focus-menu" id="focus-menu" role="listbox" tabindex="-1"
             aria-label="Cards to focus" hidden></div>
        <p class="gp-focus-msg" id="focus-msg" role="status" aria-live="polite"></p>
        <div class="gp-focus-kept" id="focus-kept" hidden></div>
      </div>
      <label class="gp-search">
        <span class="visually-hidden">Search cards</span>
        <input type="search" id="q" placeholder="Search name or type&hellip;" aria-label="Search cards by name or type" autocomplete="off">
      </label>
      <div id="facets"></div>
    </aside>

    <section class="gp-main">
      <div class="gp-bar">
        <button class="gp-pane-toggle" id="pane-toggle" type="button" aria-expanded="false">Filters</button>
        <span class="gp-count" id="count">loading&hellip;</span>
        <button class="gp-lock" id="click-focus" type="button" aria-pressed="false"
          title="Off: tapping a node shows the card, with a Focus button inside it. On: tapping re-centers straight away.">
          &#128274; Tap to focus
        </button>
        <div class="gp-views" role="group" aria-label="View">
          <button class="gp-view is-on" data-view="list" type="button" aria-pressed="true">List</button>
          <button class="gp-view" data-view="graph" type="button" aria-pressed="false">Graph</button>
        </div>
      </div>
      <details class="gp-copilot" id="copilot" open hidden></details>
      <div id="result"></div>
      <div class="gp-groups" id="groups" hidden></div>
      <div id="cy" hidden></div>
      <p class="gp-legend" id="legend" hidden></p>
    </section>
  </main>
</body>
</html>
